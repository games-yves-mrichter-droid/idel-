plugins { id 'com.android.application' }

android {
    namespace 'de.fabelwesen.app'
    compileSdk 34
    defaultConfig {
        applicationId 'de.fabelwesen.app'
        minSdk 24
        targetSdk 34
        versionCode 16
        versionName '3.2'
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets { main { assets.srcDirs += ["$buildDir/generated/webassets"] } }
}

// Das Spiel liegt im Ordner fabelwesen/ und wird beim Bauen in die App kopiert.
def copyWeb = tasks.register('copyWebAssets', Copy) {
    from(rootProject.file('..')) { include 'index.html', 'three.min.js', 'icon.svg', 'manifest.webmanifest' }
    into "$buildDir/generated/webassets/www"
}
tasks.named('preBuild') { dependsOn copyWeb }
