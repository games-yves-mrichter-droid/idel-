<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<title>Fabelwesen</title>

<style>
:root{
  --bg:#1c1233;--panel:#2d1f4f;--panel2:#3d2b68;--line:#5b4596;
  --text:#fff7ff;--muted:#c9b8ee;--accent:#ff8fd0;--gold:#ffd25e;
  --good:#6ee7a0;--blue:#7cc8ff;--evil:#ff6464;--cute:#ff9fd6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);background:#1c1233d9;border:2px solid var(--line);border-radius:12px;padding:2px 8px;font-size:13px;font-weight:700;white-space:nowrap}
.lbl.ready{background:linear-gradient(#ffe27a,#ffb238);color:#4a2a00;border-color:#fff3b0;animation:bob 1s ease-in-out infinite}
.lbl.name{background:#ffffffe6;color:#3b2470;border-color:#fff}
@keyframes bob{50%{margin-top:-6px}}
.float{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:18px;text-shadow:0 2px 3px #000a;animation:up 1.4s ease-out forwards;pointer-events:none;white-space:nowrap}
@keyframes up{to{margin-top:-70px;opacity:0}}
#hud{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:4px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;pointer-events:none;justify-content:center}
.pill{background:#1c1233cc;border:2px solid var(--line);border-radius:20px;padding:3px 8px;font-weight:800;font-size:13px;white-space:nowrap;backdrop-filter:blur(4px)}
.pill.g{color:var(--gold)}
#strip{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;padding:6px 10px;scrollbar-width:none;touch-action:pan-x}
#strip::-webkit-scrollbar{display:none}
.cc{flex:0 0 74px;background:#2d1f4fe6;border:2px solid var(--line);border-radius:14px;padding:4px 2px 3px;text-align:center;cursor:pointer;position:relative}
.cc.sel{border-color:var(--accent);box-shadow:0 0 0 2px #ff8fd055}
.cc img{width:52px;height:52px;display:block;margin:0 auto}
.cc .n{font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.cc .s{font-size:10px;color:var(--muted)}
.cc .badge{position:absolute;top:-4px;right:-4px;background:var(--gold);color:#4a2a00;border-radius:10px;font-size:11px;font-weight:800;padding:0 5px}
.cc.away img{opacity:.35}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:linear-gradient(#3a2766,#25183f);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:7px 0 6px;font-size:11px;font-weight:600;cursor:pointer}
nav button b{display:block;font-size:24px;line-height:1.1}
nav button.on{color:var(--accent)}
#sheet{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));max-height:40%;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(#35245ff2,#24173ff7);border-top:2px solid var(--line);border-radius:22px 22px 0 0;padding:6px 12px 12px;transform:translateY(110%);transition:transform .25s;z-index:15;touch-action:pan-y}
#sheet.open{transform:none}
.x{position:absolute;right:10px;top:8px;background:var(--panel2);border:0;color:var(--text);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
#sheet::before{content:'';display:block;width:42px;height:4px;border-radius:3px;background:#ffffff40;margin:0 auto 6px}
.hdr{display:flex;gap:8px;align-items:center;padding-right:36px}
.hdr img{width:44px;height:44px;background:#ffffff14;border-radius:14px}
.nm{font-size:17px;font-weight:800;cursor:pointer}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;margin:2px 3px 0 0;background:var(--panel2)}
.tag.cute{background:#ff9fd633;color:var(--cute)}
.tag.evil{background:#ff646433;color:var(--evil)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;margin:6px 0 8px}
.bar{font-size:11px;color:var(--muted)}
.bar .t{height:7px;background:#0005;border-radius:6px;overflow:hidden;margin-top:2px}
.bar .f{height:100%;border-radius:6px;transition:width .4s}
.xp .f{background:linear-gradient(90deg,#9b7bff,#ff8fd0)}
.hu .f{background:linear-gradient(90deg,#ff9a4d,#ffd25e)}
.en .f{background:linear-gradient(90deg,#4dd0ff,#7cffc6)}
.ha .f{background:linear-gradient(90deg,#ff6fb5,#ffb3dd)}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
#sheet button.btn{padding:7px 4px;font-size:12px}
#sheet button.btn small{font-size:10px}
#sheet .tag{font-size:10px;padding:0 6px}
button.btn{background:linear-gradient(#ff9fd6,#d9539b);color:#fff;border:0;border-radius:14px;padding:10px 6px;font-weight:800;font-size:13px;cursor:pointer;text-shadow:0 1px 2px #0006;box-shadow:0 3px 0 #0004}
button.btn small{display:block;font-weight:600;font-size:11px;opacity:.9}
button.btn.b{background:linear-gradient(#8ad3ff,#3b8fd9)}
button.btn.y{background:linear-gradient(#ffe27a,#f0a020);color:#4a2a00;text-shadow:none}
button.btn.v{background:linear-gradient(#b99bff,#7a4fd9)}
button.btn.gr{background:var(--panel2);box-shadow:none}
button.btn:disabled{opacity:.4;cursor:default}
.task{display:flex;align-items:center;gap:10px;background:#0003;border-radius:14px;padding:8px 10px;margin-bottom:7px}
.task .e{font-size:26px;width:34px;text-align:center}
.task .i{flex:1;min-width:0}
.task .i b{display:block;font-size:14px}
.task .i span{font-size:11px;color:var(--muted)}
.task button{min-width:76px}
.task.lock{opacity:.45}
.prog{height:12px;background:#0005;border-radius:8px;overflow:hidden;margin:8px 0}
.prog div{height:100%;background:linear-gradient(90deg,#ffd25e,#ff8fd0)}
#page{position:fixed;inset:0;background:var(--bg);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(90px + env(safe-area-inset-bottom));display:none;z-index:12;touch-action:pan-y}
#page.open{display:block}
#page h2{margin:0 0 4px;font-size:22px}
.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px}
.egg{display:flex;gap:12px;align-items:center}
.egg img{width:76px;height:76px}
.egg .i{flex:1}
.odds{font-size:11px;color:var(--muted);margin-top:3px}
.seg{display:flex;background:#0004;border-radius:14px;padding:3px;margin-bottom:12px}
.seg button{flex:1;background:none;border:0;color:var(--muted);padding:8px 4px;border-radius:11px;font-weight:700;font-size:13px;cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--text)}
.book{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.be{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:6px;text-align:center;cursor:pointer}
.be img{width:100%;aspect-ratio:1;display:block}
.be img.sil{filter:brightness(0) opacity(.55)}
.be b{font-size:12px;display:block}
.stg{display:flex;gap:4px;justify-content:space-between;margin:8px 0}
.stg div{flex:1;text-align:center;font-size:10px;color:var(--muted)}
.stg img{width:100%;aspect-ratio:1;background:#ffffff10;border-radius:10px}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
#modal.open{display:flex}
#modal .box{background:linear-gradient(#3d2b68,#2a1c4a);border:2px solid var(--line);border-radius:22px;padding:18px;max-width:380px;width:100%;text-align:center;max-height:90%;overflow-y:auto}
#modal img.big{width:150px;height:150px}
#modal input,#modal textarea{width:100%;font-size:17px;padding:10px;border-radius:12px;border:2px solid var(--line);background:#0004;color:var(--text);text-align:center;margin:10px 0;user-select:text;-webkit-user-select:text}
#modal textarea{font-size:11px;text-align:left;height:120px}
#ghud{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top));transform:translateX(-50%);background:#1c1233dd;border:2px solid #ffd25e;border-radius:18px;padding:8px 18px;font-size:22px;font-weight:800;display:none;z-index:30;pointer-events:none;white-space:nowrap}
#tod{pointer-events:auto;cursor:pointer}
.nb{position:absolute;margin:-4px 0 0 -6px;background:#ff5a7a;color:#fff;border-radius:9px;font-size:10px;padding:0 5px;font-weight:800}
nav button{position:relative}
#battle{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));background:linear-gradient(#35245ff2,#24173ff7);border-top:2px solid #ffd25e;border-radius:22px 22px 0 0;padding:10px 12px 12px;transform:translateY(110%);transition:transform .25s;z-index:16}
#battle.open{transform:none}
#battle button.btn{padding:8px 4px;font-size:12px}
#place button.btn{padding:8px 10px;font-size:13px}
#place{position:fixed;left:8px;right:8px;bottom:calc(68px + env(safe-area-inset-bottom));display:none;flex-wrap:wrap;gap:6px;align-items:center;background:#1c1233ee;border:2px solid #ffd25e;border-radius:16px;padding:8px;z-index:17}
#photo{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));display:none;justify-content:center;gap:14px;z-index:30}
#photo button{width:58px;height:58px;border-radius:50%;border:3px solid #fff;background:#0007;color:#fff;font-size:24px}
#photo button.snap{width:74px;height:74px;background:#fff;color:#000}
body.photo #hud,body.photo #strip,body.photo #sheet,body.photo nav,body.photo #labels,body.photo #battle,body.photo #ghud,body.photo #place{display:none!important}
body.photo #photo{display:flex}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .3s;z-index:60}
#toast{position:fixed;left:50%;top:calc(56px + env(safe-area-inset-top));transform:translateX(-50%);background:#1c1233ee;border:2px solid var(--accent);border-radius:16px;padding:8px 14px;font-weight:700;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;max-width:90%;text-align:center}
#toast.on{opacity:1}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
</style>
</head>

        if(I.t>4.8){const aw=Math.random()<.5,win=aw?wa:wb,los=aw?wb:wa,wc=aw?a:b,lc=aw?b:a;win.hop=1;floatAt(win,'🏆 Sieg!','#ffd25e');burst('😤',overW(win),3,{size:.45});
