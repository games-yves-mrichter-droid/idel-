html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}

#c{position:fixed;inset:0;width:100%;height:100%;display:block}

.lbl{position:absolute;transform:translate(-50%,-100%);background:#1c1233d9;border:2px solid var(--line);border-radius:12px;padding:2px 8px;font-size:13px;font-weight:700;white-space:nowrap}

.float{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:18px;text-shadow:0 2px 3px #000a;animation:up 1.4s ease-out forwards;pointer-events:none;white-space:nowrap}

.hdr{display:flex;gap:8px;align-items:center;padding-right:36px}

.nm{font-size:17px;font-weight:800;cursor:pointer}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;margin:2px 3px 0 0;background:var(--panel2)}

.bars{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;margin:6px 0 8px}
.bar{font-size:11px;color:var(--muted)}
.bar .t{height:7px;background:#0005;border-radius:6px;overflow:hidden;margin-top:2px}

.xp .f{background:linear-gradient(90deg,#9b7bff,#ff8fd0)}
.hu .f{background:linear-gradient(90deg,#ff9a4d,#ffd25e)}
.en .f{background:linear-gradient(90deg,#4dd0ff,#7cffc6)}
.ha .f{background:linear-gradient(90deg,#ff6fb5,#ffb3dd)}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
#sheet button.btn{padding:7px 4px;font-size:12px}

button.btn{background:linear-gradient(#ff9fd6,#d9539b);color:#fff;border:0;border-radius:14px;padding:10px 6px;font-weight:800;font-size:13px;cursor:pointer;text-shadow:0 1px 2px #0006;box-shadow:0 3px 0 #0004}
button.btn small{display:block;font-weight:600;font-size:11px;opacity:.9}
button.btn.b{background:linear-gradient(#8ad3ff,#3b8fd9)}
button.btn.y{background:linear-gradient(#ffe27a,#f0a020);color:#4a2a00;text-shadow:none}
button.btn.v{background:linear-gradient(#b99bff,#7a4fd9)}

.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px}
.egg{display:flex;gap:12px;align-items:center}

.odds{font-size:11px;color:var(--muted);margin-top:3px}
.seg{display:flex;background:#0004;border-radius:14px;padding:3px;margin-bottom:12px}

.nb{position:absolute;margin:-4px 0 0 -6px;background:#ff5a7a;color:#fff;border-radius:9px;font-size:10px;padding:0 5px;font-weight:800}
nav button{position:relative}

.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
</style>
</head>

/* ================== Tageszeit (1 Spielstunde = 1 echte Minute) & Wetter ================== */
const DN={h:12,e:1,night:0,rain:0,fog:0};
const PALS={day:{top:0x3a74c8,mid:0xb7c6ee,bot:0xffe2ee,fog:0x9fb0d4,hemi:.6,sun:2.5,sunC:0xfff0d8,rim:.9,exp:1.05},
  dusk:{top:0x2b3f8a,mid:0xe08a9a,bot:0xffb07a,fog:0x9a7e9e,hemi:.42,sun:1.5,sunC:0xff9a5a,rim:.6,exp:1.12},
  night:{top:0x040920,mid:0x161a40,bot:0x24204a,fog:0x1a2040,hemi:.2,sun:.55,sunC:0x9fb4ff,rim:.35,exp:1.3}};
for(const k in PALS)for(const f of['top','mid','bot','fog','sunC'])PALS[k][f]=new THREE.Color(PALS[k][f]);
const gameHour=()=>window.__hour??(now()/60000)%24;
const _pal={top:new THREE.Color(),mid:new THREE.Color(),bot:new THREE.Color(),fog:new THREE.Color(),sunC:new THREE.Color()},GREY=new THREE.Color(0x5d6470),GREYN=new THREE.Color(0x14161e);
function mixPal(a,b,t){for(const f of['top','mid','bot','fog','sunC'])_pal[f].copy(a[f]).lerp(b[f],t);for(const f of['hemi','sun','rim','exp'])_pal[f]=a[f]+(b[f]-a[f])*t;return _pal}
let envT=0;const SD=new V3(),MD=new V3();
function updDay(dt){const h=gameHour(),ang=(h-6)/24*Math.PI*2;SD.set(Math.cos(ang)*.8,Math.sin(ang),.45).normalize();MD.set(-SD.x,Math.max(.35,-SD.y),.3).normalize();
  const e=SD.y;DN.h=h;DN.e=e;DN.night=clamp((.05-e)/.25,0,1);
  const P=e>=.25?mixPal(PALS.day,PALS.day,0):e>=0?mixPal(PALS.dusk,PALS.day,e/.25):e>=-.2?mixPal(PALS.night,PALS.dusk,(e+.2)/.2):mixPal(PALS.night,PALS.night,0);
  const want=WX.type==='regen'?1:0,wf=WX.type==='nebel'?1:0;DN.rain+=(want-DN.rain)*Math.min(1,dt*.3);DN.fog+=(wf-DN.fog)*Math.min(1,dt*.3);

  const moving=w.state==='walk'?1:0;w.walk+=dt*(moving?9:0);

function lerpAng(a,b,t){let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*Math.min(1,t)}
function easeBack(t){const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}
let fpsN=0,fpsT=0,fpsDone=0,VOFF=0;

  for(const id in W.cre)animCreature(id,W.cre[id],dt);

    const ready=e.end<=now();o.position.set(b.x,b.y+(ready?Math.abs(Math.sin(T*4))*.12:0),b.z);o.rotation.z=Math.sin(T*(ready?9:2))*(ready?.12:.03)+Math.sin(T*30)*o.userData.wob*.2}
  for(let i=W.hatch.length-1;i>=0;i--){const h=W.hatch[i];h.t+=dt;h.o.rotation.z=Math.sin(h.t*35)*h.t*.25;h.o.scale.setScalar(1+h.t*.15);if(h.t>1.4){W.hatch.splice(i,1);finishHatch(h)}}
  for(let i=W.shells.length-1;i>=0;i--){const s=W.shells[i],u=s.userData;u.t+=dt;u.v.y-=9*dt;s.position.addScaledVector(u.v,dt);s.rotation.x+=u.r.x*dt;s.rotation.z+=u.r.z*dt;
    if(s.position.y<.1){s.position.y=.1;u.v.set(0,0,0);u.r.set(0,0,0)}if(u.t>2.5){s.scale.multiplyScalar(.9);if(u.t>3){world.remove(s);W.shells.splice(i,1)}}}

  {const cx=camera.position.x,cz=camera.position.z,tx=cam.tgt.x,tz=cam.tgt.z,vx=tx-cx,vz=tz-cz,vl=Math.hypot(vx,vz)||1;
