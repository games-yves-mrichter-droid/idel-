<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b1a4a">
<title>Fabelwesen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#1c1233;--panel:#2d1f4f;--panel2:#3d2b68;--line:#5b4596;
  --text:#fff7ff;--muted:#c9b8ee;--accent:#ff8fd0;--gold:#ffd25e;
  --good:#6ee7a0;--blue:#7cc8ff;--evil:#ff6464;--cute:#ff9fd6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);background:#1c1233d9;border:2px solid var(--line);border-radius:12px;padding:2px 8px;font-size:13px;font-weight:700;white-space:nowrap}
.lbl.ready{background:linear-gradient(#ffe27a,#ffb238);color:#4a2a00;border-color:#fff3b0;animation:bob 1s ease-in-out infinite}
.lbl.name{background:#ffffffe6;color:#3b2470;border-color:#fff}
@keyframes bob{50%{margin-top:-6px}}
.float{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:18px;text-shadow:0 2px 3px #000a;animation:up 1.4s ease-out forwards;pointer-events:none;white-space:nowrap}
@keyframes up{to{margin-top:-70px;opacity:0}}
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;pointer-events:none;justify-content:center}
.pill{background:#1c1233cc;border:2px solid var(--line);border-radius:20px;padding:4px 12px;font-weight:800;font-size:15px;backdrop-filter:blur(4px)}
.pill.g{color:var(--gold)}
#strip{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;padding:6px 10px;scrollbar-width:none;touch-action:pan-x}
#strip::-webkit-scrollbar{display:none}
.cc{flex:0 0 74px;background:#2d1f4fe6;border:2px solid var(--line);border-radius:14px;padding:4px 2px 3px;text-align:center;cursor:pointer;position:relative}
.cc.sel{border-color:var(--accent);box-shadow:0 0 0 2px #ff8fd055}
.cc img{width:52px;height:52px;display:block;margin:0 auto}
.cc .n{font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.cc .s{font-size:10px;color:var(--muted)}
.cc .badge{position:absolute;top:-4px;right:-4px;background:var(--gold);color:#4a2a00;border-radius:10px;font-size:11px;font-weight:800;padding:0 5px}
.cc.away img{opacity:.35}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:linear-gradient(#3a2766,#25183f);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:7px 0 6px;font-size:11px;font-weight:600;cursor:pointer}
nav button b{display:block;font-size:24px;line-height:1.1}
nav button.on{color:var(--accent)}
#sheet{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));max-height:62%;overflow-y:auto;background:linear-gradient(#35245ff2,#24173ff7);border-top:2px solid var(--line);border-radius:22px 22px 0 0;padding:12px 14px 14px;transform:translateY(110%);transition:transform .25s;z-index:15;touch-action:pan-y}
#sheet.open{transform:none}
.x{position:absolute;right:10px;top:8px;background:var(--panel2);border:0;color:var(--text);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
.hdr{display:flex;gap:10px;align-items:center;padding-right:36px}
.hdr img{width:58px;height:58px;background:#ffffff14;border-radius:14px}
.nm{font-size:20px;font-weight:800;cursor:pointer}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;margin:2px 3px 0 0;background:var(--panel2)}
.tag.cute{background:#ff9fd633;color:var(--cute)}
.tag.evil{background:#ff646433;color:var(--evil)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:10px 0}
.bar{font-size:12px;color:var(--muted)}
.bar .t{height:9px;background:#0005;border-radius:6px;overflow:hidden;margin-top:2px}
.bar .f{height:100%;border-radius:6px;transition:width .4s}
.xp .f{background:linear-gradient(90deg,#9b7bff,#ff8fd0)}
.hu .f{background:linear-gradient(90deg,#ff9a4d,#ffd25e)}
.en .f{background:linear-gradient(90deg,#4dd0ff,#7cffc6)}
.ha .f{background:linear-gradient(90deg,#ff6fb5,#ffb3dd)}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button.btn{background:linear-gradient(#ff9fd6,#d9539b);color:#fff;border:0;border-radius:14px;padding:10px 6px;font-weight:800;font-size:13px;cursor:pointer;text-shadow:0 1px 2px #0006;box-shadow:0 3px 0 #0004}
button.btn small{display:block;font-weight:600;font-size:11px;opacity:.9}
button.btn.b{background:linear-gradient(#8ad3ff,#3b8fd9)}
button.btn.y{background:linear-gradient(#ffe27a,#f0a020);color:#4a2a00;text-shadow:none}
button.btn.v{background:linear-gradient(#b99bff,#7a4fd9)}
button.btn.gr{background:var(--panel2);box-shadow:none}
button.btn:disabled{opacity:.4;cursor:default}
.task{display:flex;align-items:center;gap:10px;background:#0003;border-radius:14px;padding:8px 10px;margin-bottom:7px}
.task .e{font-size:26px;width:34px;text-align:center}
.task .i{flex:1;min-width:0}
.task .i b{display:block;font-size:14px}
.task .i span{font-size:11px;color:var(--muted)}
.task button{min-width:76px}
.task.lock{opacity:.45}
.prog{height:12px;background:#0005;border-radius:8px;overflow:hidden;margin:8px 0}
.prog div{height:100%;background:linear-gradient(90deg,#ffd25e,#ff8fd0)}
#page{position:fixed;inset:0;background:var(--bg);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(90px + env(safe-area-inset-bottom));display:none;z-index:12;touch-action:pan-y}
#page.open{display:block}
#page h2{margin:0 0 4px;font-size:22px}
.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px}
.egg{display:flex;gap:12px;align-items:center}
.egg img{width:76px;height:76px}
.egg .i{flex:1}
.odds{font-size:11px;color:var(--muted);margin-top:3px}
.seg{display:flex;background:#0004;border-radius:14px;padding:3px;margin-bottom:12px}
.seg button{flex:1;background:none;border:0;color:var(--muted);padding:8px 4px;border-radius:11px;font-weight:700;font-size:13px;cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--text)}
.book{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.be{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:6px;text-align:center;cursor:pointer}
.be img{width:100%;aspect-ratio:1;display:block}
.be img.sil{filter:brightness(0) opacity(.55)}
.be b{font-size:12px;display:block}
.stg{display:flex;gap:4px;justify-content:space-between;margin:8px 0}
.stg div{flex:1;text-align:center;font-size:10px;color:var(--muted)}
.stg img{width:100%;aspect-ratio:1;background:#ffffff10;border-radius:10px}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
#modal.open{display:flex}
#modal .box{background:linear-gradient(#3d2b68,#2a1c4a);border:2px solid var(--line);border-radius:22px;padding:18px;max-width:380px;width:100%;text-align:center;max-height:90%;overflow-y:auto}
#modal img.big{width:150px;height:150px}
#modal input,#modal textarea{width:100%;font-size:17px;padding:10px;border-radius:12px;border:2px solid var(--line);background:#0004;color:var(--text);text-align:center;margin:10px 0;user-select:text;-webkit-user-select:text}
#modal textarea{font-size:11px;text-align:left;height:120px}
#toast{position:fixed;left:50%;top:calc(56px + env(safe-area-inset-top));transform:translateX(-50%);background:#1c1233ee;border:2px solid var(--accent);border-radius:16px;padding:8px 14px;font-weight:700;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;max-width:90%;text-align:center}
#toast.on{opacity:1}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
</style>
</head>

  if(ptrs.size===1){cam.wth-=dx*.008;cam.wph=clamp(cam.wph-dy*.006,.35,1.38);if(tap){tap.moved+=Math.abs(dx)+Math.abs(dy)}}
  else if(ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0>0)cam.wd=clamp(d0*pinch0/d,5,34)}});

const ray=new THREE.Raycaster();
function onTap(x,y){ray.setFromCamera(new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1),camera);

  if(!hit){if(selId!==null)closeSheet();return}
  let o=hit.object;while(o&&!o.userData.pick)o=o.parent;if(!o)return;
  const pk=o.userData.pick;
  if(pk.k==='c'){const c=crById(pk.id);if(c&&c.task&&c.task.end<=now())collect(c);else select(pk.id)}
  else tapEgg(pk.id)}

function nat(c){return spOf(c).cute?1:2}
function taskReward(c,t){const sp=spOf(c);let m=RAR[sp.r].m*(1+c.lv*.08);let note='';
  if(c.hunger<25){m*=.5;note='Hungrig: halbe Belohnung'}else if(c.happy>=70){m*=1.25;note='Gute Laune: +25 %'}
  return{g:Math.round(t.g*m),x:Math.round(t.x*(1+c.lv*.05)*(c.hunger<25?.5:1)),note}}
function addXP(c,x){if(c.lv>=MAXLV)return;c.xp+=x;let lvUp=false;const st0=stageOf(c.lv);
  while(c.lv<MAXLV&&c.xp>=xpNeed(c.lv)){c.xp-=xpNeed(c.lv);c.lv++;lvUp=true}
  if(c.lv>=MAXLV)c.xp=0;
  if(lvUp){const w=W.cre[c.id];const st=stageOf(c.lv);S.seen[c.sp]=Math.max(S.seen[c.sp]??0,st);
    if(w){burst('⭐',w.pos.clone().add(new V3(0,w.b.h,0)),10,{spd:2.5});floatAt(w,'Level '+c.lv+'!','#ffd25e')}
    if(st>st0){toast(`🎉 ${c.name} ist gewachsen und jetzt ${STAGES[st].n}!`);if(w){rebuild(c);const n=W.cre[c.id];burst('✨',n.pos.clone().add(new V3(0,1,0)),18,{spd:3,up:4})}}
    else toast(`⭐ ${c.name} hat Level ${c.lv} erreicht!`)}}
function feed(c){const cost=feedCost(c);if(S.gold<cost)return toast('Nicht genug Gold!');if(c.hunger>=98)return toast(`${c.name} ist schon satt.`);
  S.gold-=cost;c.hunger=Math.min(100,c.hunger+35);c.happy=Math.min(100,c.happy+5);
  const w=W.cre[c.id];if(w){w.hop=1;burst(pick(['🍖','🍎','🍓','🥕']),w.pos.clone().add(new V3(0,w.b.h*.8,0)),5,{size:.45})}
  addXP(c,2);refresh()}
const feedCost=c=>5+c.lv*2;
function pet(c){const t=now();if(t<c.petAt)return;c.petAt=t+20000;c.happy=Math.min(100,c.happy+20);
  const w=W.cre[c.id];if(w){w.hop=1;burst(spOf(c).cute?'💖':pick(['😈','🔥','💢']),w.pos.clone().add(new V3(0,w.b.h*.9,0)),7,{size:.45,spd:1.5})}
  addXP(c,1);refresh()}
function startTask(c,t){if(c.task)return;if(c.energy<t.en)return toast(`${c.name} ist zu müde. Warte etwas!`);
  const r=taskReward(c,t);c.energy-=t.en;c.task={id:t.id,start:now(),end:now()+t.t*1000,g:r.g,x:r.x};
  const w=W.cre[c.id];if(w)burst('💨',w.pos.clone().add(new V3(0,.4,0)),8,{size:.6,spd:2.5,up:1.5,g:0});
  toast(`${t.e} ${c.name}: ${t.n} gestartet`);sheetMode='info';syncWorld();refresh()}
function collect(c){if(!c.task||c.task.end>now())return;const t=c.task;c.task=null;S.gold+=t.g;S.tasksDone++;
  const w=W.cre[c.id];if(w){burst('💰',w.pos.clone().add(new V3(0,w.b.h,0)),8,{spd:2});floatAt(w,'+'+fmt(t.g)+' 💰','#ffd25e')}
  addXP(c,t.x);if(selId===null)select(c.id);refresh()}
function tapEgg(id){const e=S.eggs.find(x=>x.id===id);if(!e)return;const o=W.eggs[id];
  if(e.end>now()){e.end-=1500;burst('💗',o.position.clone().add(new V3(0,.6,0)),2,{size:.35,spd:.8,up:2});o.userData.wob=1;refreshTimers();return}
  if(S.creatures.length>=S.slots)return toast('🏝️ Die Insel ist voll! Kaufe mehr Platz im Shop oder lasse ein Wesen frei.');
  if(W.hatch.find(h=>h.e.id===id))return;
  W.hatch.push({e,o,t:0})}
function finishHatch(h){const e=h.e;S.eggs=S.eggs.filter(x=>x.id!==e.id);world.remove(h.o);delete W.eggs[e.id];
  const pos=h.o.position.clone();
  for(const[g,v]of[[GEO.hTop,1],[GEO.hBot,-1]]){const m=mesh(g,M(EGG[e.type].c));m.scale.set(.42,.56,.42);m.position.copy(pos);
    m.userData={v:new V3(rnd(-1,1),2+v,rnd(-1,1)),r:new V3(rnd(-4,4),0,rnd(-4,4)),t:0};world.add(m);W.shells.push(m)}
  burst('✨',pos.clone().add(new V3(0,.4,0)),16,{spd:3,up:4});
  const sp=SPECIES[e.sp];const c={id:S.nextId++,sp:e.sp,name:pick(sp.names),lv:1,xp:0,hunger:80,energy:100,happy:80,task:null,petAt:0,born:now()};
  S.creatures.push(c);S.hatched++;const isNew=S.seen[c.sp]===undefined;S.seen[c.sp]=Math.max(S.seen[c.sp]??0,0);
  const off=pos.clone().normalize().multiplyScalar(-1.6);const w=spawnCreature(c,pos.clone().add(off),true);w.yaw=Math.atan2(-pos.x,-pos.z);
  syncWorld();save();refresh();
  setTimeout(()=>nameModal(c,isNew),700)}
function buyEgg(type,natSel){const e=EGG[type];const price=eggPrice(e,natSel);
  if(S.gold<price)return toast('Nicht genug Gold!');if(S.eggs.length>=S.nests)return toast('Alle Nester sind belegt! Kaufe ein weiteres Nest.');
  S.gold-=price;
  const roll=Math.random()*100;let r=0,acc=0;for(let i=0;i<4;i++){acc+=e.odds[i];if(roll<acc){r=i;break}}
  let pool=SP_IDS.filter(id=>SPECIES[id].r===r&&(natSel===0||(natSel===1)===SPECIES[id].cute));
  if(!pool.length)pool=SP_IDS.filter(id=>SPECIES[id].r===r);
  S.eggs.push({id:S.nextId++,type,sp:pick(pool),end:now()+e.time*1000});
  syncWorld();save();refresh();toast(`🥚 ${e.n} liegt jetzt im Nest! Tippe es an, um es zu wärmen.`);
  goPage('insel');focusOn(W.eggs[S.eggs[S.eggs.length-1].id].userData.base,9)}
const eggPrice=(e,n)=>Math.round(e.price*(n?1.3:1));
const slotPrice=()=>Math.round(400*Math.pow(1.9,S.slots-6));
const nestPrice=()=>Math.round(300*Math.pow(2.4,S.nests-2));

    <input id="nmIn" maxlength="14" value="${esc(c.name)}"><button class="btn" style="width:100%" id="nmOk">${rename?'Speichern':'Willkommen!'}</button>`);
  $('#nmOk').onclick=()=>{const v=$('#nmIn').value.trim();if(v)c.name=v;closeModal();select(c.id);refresh()}}
function confirmModal(title,txt,fn){modal(`<h3 style="margin-top:0">${title}</h3><p style="color:var(--muted)">${txt}</p><div class="row"><button class="btn gr grow" id="mNo">Abbrechen</button><button class="btn grow" id="mYes">Ja</button></div>`);
  $('#mNo').onclick=closeModal;$('#mYes').onclick=()=>{closeModal();fn()}}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ================== Seiten ================== */
let curPage='insel',shopNat=0,bookSel=null;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>goPage(b.dataset.p));
function goPage(p){curPage=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  const pg=$('#page');if(p==='insel'){pg.classList.remove('open');renderStrip();if(selId!==null)$('#sheet').classList.add('open');return}
  $('#sheet').classList.remove('open');bookSel=null;renderPage();pg.classList.add('open');pg.scrollTop=0;renderStrip()}
function renderPage(){const pg=$('#page');let h='';
  if(curPage==='shop'){h=`<h2>🥚 Eier-Shop</h2><div class="sub">Kaufe Eier, lege sie ins Nest und brüte neue Fabelwesen aus.</div>
    <div class="seg">${['🎲 Zufall','💖 Niedlich','😈 Böse'].map((n,i)=>`<button data-nat="${i}" class="${shopNat===i?'on':''}">${n}</button>`).join('')}</div>
    ${shopNat?'<div class="sub" style="margin-top:-6px">Gezielte Wahl kostet 30 % mehr.</div>':''}`;
    for(const e of EGGS){const p=eggPrice(e,shopNat);
      h+=`<div class="card egg"><img src="${eggThumb(e.id)}"><div class="i"><b>${e.n}</b><div style="font-size:12px;color:var(--muted)">${e.d}</div>
        <div class="odds">${e.odds.map((o,i)=>o?`<span style="color:${RAR[i].c}">${RAR[i].n} ${o}%</span>`:'').filter(Boolean).join(' · ')} · ⏱ ${fmtT(e.time)}</div>
        <button class="btn y" style="margin-top:6px" data-buy="${e.id}" data-p="${p}" ${S.gold<p?'disabled':''}>Kaufen · ${fmt(p)} 💰</button></div></div>`}
    h+=`<h2 style="margin-top:18px">🏗️ Ausbau</h2><div class="sub">Mehr Platz für mehr Fabelwesen.</div>
      <div class="card row"><div class="grow"><b>🏝️ Inselplatz +1</b><div style="font-size:12px;color:var(--muted)">Aktuell ${S.slots} Plätze</div></div><button class="btn y" data-up="slot" data-p="${slotPrice()}" ${S.gold<slotPrice()?'disabled':''}>${fmt(slotPrice())} 💰</button></div>
      ${S.nests<NEST_POS.length?`<div class="card row"><div class="grow"><b>🪺 Nest +1</b><div style="font-size:12px;color:var(--muted)">Aktuell ${S.nests} Nester – mehr Eier gleichzeitig ausbrüten</div></div><button class="btn y" data-up="nest" data-p="${nestPrice()}" ${S.gold<nestPrice()?'disabled':''}>${fmt(nestPrice())} 💰</button></div>`:''}`}
  if(curPage==='buch'){const seen=Object.keys(S.seen).length;
    if(bookSel){const sp=SPECIES[bookSel],mx=S.seen[bookSel];
      h=`<button class="btn gr" data-bk="" style="margin-bottom:10px">← Zurück</button><div class="card" style="text-align:center"><img src="${thumb(bookSel,mx)}" style="width:170px;height:170px"><h2>${sp.n}</h2>
        <div><span class="tag" style="color:${RAR[sp.r].c}">${RAR[sp.r].n}</span><span class="tag ${sp.cute?'cute':'evil'}">${sp.cute?'💖 niedlich':'😈 böse'}</span></div><p style="color:var(--muted);font-size:13px">${sp.d}</p>
        <b>Lebensabschnitte</b><div class="stg">${STAGES.map((s,i)=>`<div><img src="${thumb(bookSel,i)}" class="${i>mx?'sil':''}" style="${i>mx?'filter:brightness(0) opacity(.5)':''}"><br>${s.n}<br>Lv ${s.lv}</div>`).join('')}</div></div>`}
    else{h=`<h2>📖 Fabelbuch</h2><div class="sub">${seen} von ${SP_IDS.length} Fabelwesen entdeckt</div><div class="book">`;
      for(const id of SP_IDS){const sp=SPECIES[id],k=S.seen[id]!==undefined;
        h+=`<div class="be" data-bk="${k?id:''}" style="border-color:${k?RAR[sp.r].c+'88':'var(--line)'}"><img src="${thumb(id,3)}" class="${k?'':'sil'}"><b>${k?sp.n:'???'}</b><span style="font-size:10px;color:${RAR[sp.r].c}">${RAR[sp.r].n}</span></div>`}
      h+='</div>'}}
  if(curPage==='menu'){const best=S.creatures.reduce((a,c)=>Math.max(a,c.lv),0);
    h=`<h2>⚙️ Menü</h2><div class="card"><b>📊 Statistik</b><div style="font-size:13px;color:var(--muted);margin-top:6px;line-height:1.7">
      🐣 Geschlüpft: ${S.hatched}<br>📋 Erledigte Aufgaben: ${S.tasksDone}<br>⭐ Höchstes Level: ${best}<br>📖 Entdeckt: ${Object.keys(S.seen).length}/${SP_IDS.length}</div></div>
      <div class="card"><b>❓ So geht's</b><div style="font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5">
      🥚 Kaufe Eier im Shop und tippe sie im Nest an, um sie schneller auszubrüten.<br>📋 Schicke deine Wesen auf Aufgaben – so verdienen sie Gold und Erfahrung.<br>
      🍖 Füttere sie, damit sie nicht hungrig werden, und streichle sie für gute Laune (+25 % Gold).<br>🌱 Mit höherem Level wachsen sie: Baby → Kind (Lv 5) → Jugendlich (Lv 12) → Erwachsen (Lv 22) → Uralt (Lv 35).<br>
      👆 Wische zum Drehen, mit zwei Fingern zoomen.</div></div>
      <div class="card"><b>💾 Spielstand</b><div class="row" style="margin-top:8px"><button class="btn b grow" data-m="exp">Exportieren</button><button class="btn b grow" data-m="imp">Importieren</button></div>
      <button class="btn gr" style="width:100%;margin-top:8px" data-m="reset">🗑️ Neues Spiel starten</button></div>`}
  pg.innerHTML=h}
function tickShop(){$('#page').querySelectorAll('[data-p]').forEach(b=>b.disabled=S.gold<+b.dataset.p)}
$('#page').addEventListener('click',e=>{const t=e.target.closest('[data-nat],[data-buy],[data-up],[data-bk],[data-m]');if(!t)return;const d=t.dataset;
  if(d.nat!==undefined){shopNat=+d.nat;renderPage()}
  if(d.buy)buyEgg(d.buy,shopNat);
  if(d.up==='slot'){const p=slotPrice();if(S.gold>=p){S.gold-=p;S.slots++;toast('🏝️ Mehr Platz auf der Insel!');refresh()}}
  if(d.up==='nest'){const p=nestPrice();if(S.gold>=p){S.gold-=p;S.nests++;syncWorld();toast('🪺 Neues Nest gebaut!');refresh()}}
  if(d.bk!==undefined&&(d.bk||bookSel)){bookSel=d.bk||null;renderPage();$('#page').scrollTop=0}
  if(d.m==='exp')modal(`<h3 style="margin-top:0">Spielstand exportieren</h3><textarea readonly>${btoa(unescape(encodeURIComponent(JSON.stringify(S))))}</textarea><button class="btn" style="width:100%" onclick="closeModal()">OK</button>`);
  if(d.m==='imp'){modal(`<h3 style="margin-top:0">Spielstand importieren</h3><textarea id="impT" placeholder="Code hier einfügen"></textarea><button class="btn" style="width:100%" id="impOk">Laden</button>`);
    $('#impOk').onclick=()=>{try{const n=JSON.parse(decodeURIComponent(escape(atob($('#impT').value.trim()))));if(!n.creatures)throw 0;localStorage.setItem(KEY,JSON.stringify(n));location.reload()}catch(err){toast('Ungültiger Code')}}}
  if(d.m==='reset')confirmModal('Neues Spiel starten?','Alle Fabelwesen und das Gold gehen verloren!',()=>{localStorage.removeItem(KEY);S=null;location.reload()})});
window.onAndroidBack=()=>{if($('#modal').classList.contains('open')){closeModal();return true}if(curPage!=='insel'){goPage('insel');return true}if(selId!==null){closeSheet();return true}save();return false};

/* ================== Animation ================== */
let last=performance.now(),T=0;
function animCreature(id,w,dt){const c=crById(+id);if(!c)return;const P=w.b.P,root=w.b.root;
  w.timer-=dt;
  const sel=+id===selId;
  if(sel){w.state='idle';const toCam=Math.atan2(camera.position.x-w.pos.x,camera.position.z-w.pos.z);w.yaw=lerpAng(w.yaw,toCam,dt*4)}
  else if(w.state==='idle'&&w.timer<=0){w.state='walk';w.tgt=randSpot();w.timer=12}
  else if(w.state==='walk'){const d=new V3().subVectors(w.tgt,w.pos);d.y=0;const L=d.length();
    if(L<.2||w.timer<=0){w.state='idle';w.timer=rnd(2,6)}
    else{const sp=(.7+w.st*.18)*(c.hunger<25?.6:1);const want=Math.atan2(d.x,d.z);w.yaw=lerpAng(w.yaw,want,dt*5);
      const step=Math.min(L,sp*dt);w.pos.x+=Math.sin(w.yaw)*step;w.pos.z+=Math.cos(w.yaw)*step}}
  const moving=w.state==='walk'?1:0;w.walk+=dt*(moving?9:0);
  w.pop=Math.min(1,w.pop+dt*2.2);const pop=w.pop<1?easeBack(w.pop):1;
  w.hop=Math.max(0,w.hop-dt*2);const hop=Math.sin(w.hop*Math.PI)*.5;
  root.position.set(w.pos.x,(P.hover?.25+Math.sin(T*2+ +id)*.15:0)+Math.abs(Math.sin(w.walk))*.06*moving+hop,w.pos.z);
  root.rotation.y=w.yaw;root.scale.setScalar(pop);
  P.legs.forEach(l=>l.rotation.x=moving?Math.sin(w.walk+l.userData.ph)*.6:0);
  P.wings.forEach(p=>p.rotation.z=p.userData.rest+Math.sin(T*(moving?8:2.5))*(moving?.45:.12)+hop*.8);
  P.tails.forEach((t,i)=>t.rotation.y=Math.sin(T*3+i*.6)*.35);
  P.heads.forEach((h,i)=>{h.rotation.x=Math.sin(T*1.3+i)*.06;if(h.userData.ph!==undefined)h.rotation.y=Math.sin(T*1.1+h.userData.ph)*.25});
  w.blink-=dt;const bl=w.blink<0&&w.blink>-.13;if(w.blink<-.13)w.blink=rnd(2,5);P.eyes.forEach(e=>e.scale.y=bl?.1:1);
  P.flames.forEach((f,i)=>{const s=1+Math.sin(T*14+i*2)*.12;f.scale.set(s,1+Math.sin(T*11+i)*.2,s)});
  P.orbit.forEach(o=>{const a=T*o.sp+o.ph;o.m.position.set(Math.cos(a)*o.r,o.h+Math.sin(a*2)*.15,Math.sin(a)*o.r)});
  if(P.lid)P.lid.rotation.x=-(.12+(sel?.5:.25)*Math.max(0,Math.sin(T*(moving?7:2.2)))+hop*.8);
  P.segs.forEach(s=>s.m.position.x=Math.sin(T*(moving?6:2)-s.t*7)*.18*(1-s.t*.5));
  P.tents.forEach(arr=>arr.forEach(s=>{const wv=Math.sin(T*2.5+s.a*2+s.j*.7)*.08*s.j;const dd=s.d+wv;s.m.position.set(Math.cos(s.a)*dd,s.rr*.8+(s.j>3?(s.j-3)*.1:0)+Math.max(0,wv)*.5,Math.sin(s.a)*dd)}));
  if(SPECIES[c.sp].b.smoke){w.smoke-=dt;if(w.smoke<0){w.smoke=rnd(1.5,3.5);burst('💨',w.pos.clone().add(new V3(Math.sin(w.yaw)*w.b.sc*1.6,w.b.h*.85,Math.cos(w.yaw)*w.b.sc*1.6)),1,{size:.5,spd:.3,up:.8,g:.3,life:1.5})}}}
function lerpAng(a,b,t){let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*Math.min(1,t)}
function easeBack(t){const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000);last=ts;T+=dt;grassT.value=T;
  for(const id in W.cre)animCreature(id,W.cre[id],dt);
  for(const e of S.eggs){const o=W.eggs[e.id];if(!o)continue;const b=o.userData.base;if(!b)continue;o.userData.wob=Math.max(0,(o.userData.wob||0)-dt*2);
    const ready=e.end<=now();o.position.set(b.x,b.y+(ready?Math.abs(Math.sin(T*4))*.12:0),b.z);o.rotation.z=Math.sin(T*(ready?9:2))*(ready?.12:.03)+Math.sin(T*30)*o.userData.wob*.2}
  for(let i=W.hatch.length-1;i>=0;i--){const h=W.hatch[i];h.t+=dt;h.o.rotation.z=Math.sin(h.t*35)*h.t*.25;h.o.scale.setScalar(1+h.t*.15);if(h.t>1.4){W.hatch.splice(i,1);finishHatch(h)}}
  for(let i=W.shells.length-1;i>=0;i--){const s=W.shells[i],u=s.userData;u.t+=dt;u.v.y-=9*dt;s.position.addScaledVector(u.v,dt);s.rotation.x+=u.r.x*dt;s.rotation.z+=u.r.z*dt;
    if(s.position.y<.1){s.position.y=.1;u.v.set(0,0,0);u.r.set(0,0,0)}if(u.t>2.5){s.scale.multiplyScalar(.9);if(u.t>3){world.remove(s);W.shells.splice(i,1)}}}
  clouds.forEach(c=>{const u=c.userData;u.a+=u.s*dt;c.position.set(Math.cos(u.a)*u.d,u.y,Math.sin(u.a)*u.d);c.rotation.y=-u.a});
  floaters.forEach(f=>f.position.y+=Math.sin(T*.6+f.userData.bob)*.002);
  updParts(dt);
  const sw=W.cre[selId];if(sw)cam.wtgt.lerp(new V3(sw.pos.x,Math.max(.5,sw.b.h*.5),sw.pos.z),.1);
  cam.th+=(cam.wth-cam.th)*Math.min(1,dt*8);cam.ph+=(cam.wph-cam.ph)*Math.min(1,dt*8);cam.d+=(cam.wd-cam.d)*Math.min(1,dt*4);cam.tgt.lerp(cam.wtgt,Math.min(1,dt*4));
  const sheetOpen=selId!==null&&curPage==='insel';const yOff=sheetOpen?cam.d*.16:0;
  camera.position.set(cam.tgt.x+cam.d*Math.sin(cam.ph)*Math.sin(cam.th),cam.tgt.y+cam.d*Math.cos(cam.ph)-yOff,cam.tgt.z+cam.d*Math.sin(cam.ph)*Math.cos(cam.th));
  camera.lookAt(cam.tgt.x,cam.tgt.y-yOff,cam.tgt.z);
  renderer.render(scene,camera);updLabels()}

/* ================== Start ================== */
(function start(){const away=(now()-S.t)/1000;
  S.creatures.forEach(c=>{simulate(c,Math.min(away,8*3600));S.seen[c.sp]=Math.max(S.seen[c.sp]??0,stageOf(c.lv))});
  syncWorld();refresh();
  const ready=S.creatures.filter(c=>c.task&&c.task.end<=now()).length;
  if(away>60&&S.creatures.length)toast(`👋 Willkommen zurück!${ready?` ${ready} Wesen warten mit Gold auf dich.`:''}`);
  else if(!S.tip){S.tip=1;toast('🥚 Tippe auf das Ei im Nest, um es zu wärmen!')}
  requestAnimationFrame(loop);setInterval(tick,1000);setInterval(save,5000);
  addEventListener('visibilitychange',()=>{if(document.hidden)save()});
  if('serviceWorker'in navigator&&location.protocol.startsWith('http')&&!navigator.userAgent.includes('FabelwesenApp'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
