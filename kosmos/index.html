<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--BODY-START-->
<title>Kosmos Schmiede</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#090c18">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen instrument panel — readouts on top, a live sky to tap, then a scrolling ledger of cosmic objects, tabs at the bottom. */
:root{
  --void:#090c18; --hull:#121831; --hull2:#1a2244; --seam:#2a3566;
  --ink:#e9edff; --dim:#8d97c4; --star:#ffb655; --ion:#7fe0ff; --life:#74e6a9; --flare:#ff6b8b;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--ink);font:15px/1.4 var(--f-body);user-select:none;-webkit-user-select:none;overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--ion);outline-offset:2px}
#app{height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* readouts */
#top{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px}
.stat{background:var(--hull);border:1px solid var(--seam);border-radius:10px;padding:5px 9px;min-width:0}
.stat .lbl{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{display:block;font:700 17px/1.2 var(--f-num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mat{color:var(--star)} #mps{color:var(--ion);font-size:14px} #sng{color:#d8b4ff;font-size:14px}

/* sky */
#sky{position:relative;margin-top:8px;height:clamp(150px,30vh,280px);border-radius:16px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 60%,#18214a 0%,#0b0f22 60%,#05070f 100%);border:1px solid var(--seam);flex:none;touch-action:manipulation}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.skyname{position:absolute;left:12px;bottom:8px;font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);pointer-events:none}
.skyhint{position:absolute;right:12px;bottom:8px;font-size:11px;color:var(--dim);pointer-events:none}
#mute{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:10px;border:1px solid var(--seam);background:#090c18b3;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;z-index:3}
#mute svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.slider{display:grid;grid-template-columns:5.5em minmax(0,1fr) 3em;gap:10px;align-items:center;font-size:13px;margin-top:8px}
.slider span:last-child{font-family:var(--f-num);text-align:right;color:var(--dim)}
input[type=range]{width:100%;accent-color:var(--star)}
#boost{position:absolute;left:12px;top:10px;background:#ff6b8b26;border:1px solid var(--flare);color:#ffd0da;border-radius:99px;padding:2px 10px;font:600 12px var(--f-display);letter-spacing:.05em}
#comet{position:absolute;left:0;top:0;width:46px;height:46px;border:0;padding:0;background:none;cursor:pointer;z-index:2}
#comet::before{content:"";position:absolute;right:10px;top:50%;width:70px;height:6px;margin-top:-3px;border-radius:6px;background:linear-gradient(90deg,#7fe0ff00,#7fe0ffaa);transform-origin:right center}
#comet::after{content:"";position:absolute;right:6px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:radial-gradient(circle,#fff 0 30%,#9be8ff 55%,#7fe0ff00 72%);box-shadow:0 0 18px 6px #7fe0ff88}

/* buy mode + views */
#views{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-block:10px 14px;scrollbar-width:thin}
.view{display:flex;flex-direction:column;gap:8px}
.modes{display:flex;gap:6px;align-items:center}
.modes .lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-right:auto}
.chip{background:var(--hull);border:1px solid var(--seam);border-radius:8px;padding:4px 10px;font:600 13px var(--f-display);cursor:pointer;color:var(--dim)}
.chip.on{background:var(--star);border-color:var(--star);color:#1d1204}

/* tier rows */
.tier{display:grid;grid-template-columns:52px minmax(0,1fr) 104px;gap:10px;align-items:center;background:var(--hull);border:1px solid var(--seam);border-radius:12px;padding:8px}
.tier .ico{width:52px;height:52px;border-radius:10px;background:#070a16}
.tier .nm{font:700 15px var(--f-display);letter-spacing:.02em;display:flex;gap:6px;align-items:baseline;min-width:0}
.tier .nm span{font:500 12px var(--f-num);color:var(--dim)}
.tier .sub{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tier .sub b{color:var(--ink);font-weight:600}
.prog{position:relative;height:16px;border-radius:5px;background:#070a16;border:1px solid var(--seam);margin-top:4px;overflow:hidden}
.prog i{position:absolute;inset:0;background:linear-gradient(90deg,#2d79a8,var(--ion));transform-origin:left;transform:scaleX(0)}
.prog span{position:relative;display:block;text-align:center;font:700 11px/14px var(--f-num);color:#fff;text-shadow:0 1px 2px #000}
.ms{font-size:11px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms em{font-style:normal;color:var(--life)}
.buy{background:linear-gradient(#ffc777,#e88f2a);border:0;border-radius:10px;padding:6px 4px;cursor:pointer;color:#241503;text-align:center;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.buy small{display:block;font:600 11px var(--f-display);letter-spacing:.04em}
.buy b{display:block;font:700 14px var(--f-num);white-space:nowrap}
.buy:disabled{background:var(--hull2);color:var(--dim);cursor:default}
.tier.locked .nm{color:var(--dim)}
.tier.locked .ico{filter:brightness(.15) contrast(1.5)}

/* generic panels */
.panel{background:var(--hull);border:1px solid var(--seam);border-radius:12px;padding:12px}
h2{font:700 18px var(--f-display);letter-spacing:.03em;margin:2px 0 0;text-wrap:balance}
h3{font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:10px 0 0}
p{margin:4px 0;color:var(--dim);max-width:65ch}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.item{display:flex;gap:10px;align-items:center;background:var(--hull);border:1px solid var(--seam);border-radius:12px;padding:10px}
.item .t{font:700 14px var(--f-display)}
.item .d{font-size:12px;color:var(--dim)}
.btn{background:linear-gradient(#ffc777,#e88f2a);color:#241503;border:0;border-radius:10px;padding:8px 12px;font:700 13px var(--f-display);cursor:pointer;min-width:96px;white-space:nowrap}
.btn.ion{background:linear-gradient(#a6ecff,#3fb4e0);color:#04202c}
.btn.violet{background:linear-gradient(#e2c6ff,#9a5cf0);color:#1b0836}
.btn.ghost{background:var(--hull2);color:var(--ink);border:1px solid var(--seam)}
.btn.sw-on{background:linear-gradient(#a8f5c8,#3fbf7a);color:#06210f}
.btn.sw-off{background:var(--hull2);color:var(--ink);border:1px solid var(--seam)}
.chip{white-space:nowrap}
@media (max-width:440px){.modes .lbl{display:none}.modes{justify-content:space-between}.chip{padding:4px 8px}}
.chip.auto{margin-left:auto}
.chip.auto.on{background:var(--life);border-color:var(--life);color:#06210f}
.btn.danger{background:linear-gradient(#ff9aae,#e0425f);color:#2c0310}
.btn:disabled{background:var(--hull2);color:var(--dim);cursor:default}
.big{font:700 26px var(--f-num);color:#d8b4ff}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--dim)}
.kv span:nth-child(even){font-family:var(--f-num);text-align:right}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.ach{border:1px solid var(--seam);border-radius:10px;padding:7px 9px;background:var(--hull);font-size:12px;color:var(--dim)}
.ach b{display:block;font:600 13px var(--f-display);color:var(--dim)}
.ach.done{border-color:#74e6a966;background:#74e6a914;color:var(--ink)}
.ach.done b{color:var(--life)}
textarea{width:100%;min-height:70px;background:#070a16;color:var(--ink);border:1px solid var(--seam);border-radius:8px;font:12px var(--f-num);padding:8px;user-select:text;-webkit-user-select:text;resize:vertical}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font:600 11px var(--f-display);background:var(--hull2);color:var(--dim)}
.pill.max{background:#74e6a922;color:var(--life)}

/* nav */
#nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--seam);background:var(--void);flex:none;padding-block:4px 6px}
#nav button{background:none;border:0;padding:6px 0 2px;color:var(--dim);font:600 11px var(--f-display);letter-spacing:.04em;cursor:pointer;position:relative}
#nav svg{display:block;margin:0 auto 2px;width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--star)}
#nav .dot{position:absolute;top:2px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--flare);color:#fff;font:700 10px/16px var(--f-num);padding:0 4px}

#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:20;width:min(90vw,420px)}
#toast div{background:#1a2244f2;border:1px solid var(--seam);border-radius:10px;padding:7px 12px;font-size:13px;animation:tin .25s ease-out;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#modal{position:fixed;inset:0;background:#05070fcc;display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
#modal .panel{max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
@media (prefers-reduced-motion:reduce){#toast div{animation:none}}
</style>
<div id="app">
  <header id="top">
    <div class="stat"><span class="lbl">Materie</span><b id="mat" class="num">0</b></div>
    <div class="stat"><span class="lbl">pro Sekunde</span><b id="mps" class="num">0</b></div>
    <div class="stat"><span class="lbl">Singularität</span><b id="sng" class="num">0</b></div>
  </header>
  <section id="sky" aria-label="Universum – tippen für Materie">
    <canvas id="cv"></canvas>
    <button id="comet" hidden aria-label="Komet einfangen"></button>
    <div id="boost" hidden></div>
    <div class="skyname" id="skyname">Quark</div>
    <div class="skyhint">Tippen = Materie</div>
    <button id="mute" aria-label="Ton an oder aus"></button>
  </section>
  <main id="views">
    <div class="view" id="v-kosmos">
      <div class="modes" id="modes"><span class="lbl">Kaufmenge</span></div>
      <div class="view" id="list"></div>
    </div>
    <div class="view" id="v-ups" hidden></div>
    <div class="view" id="v-bang" hidden></div>
    <div class="view" id="v-ach" hidden></div>
    <div class="view" id="v-opt" hidden></div>
  </main>
  <nav id="nav">
    <button data-v="kosmos" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><ellipse cx="12" cy="12" rx="10.5" ry="4" transform="rotate(-20 12 12)"/></svg>Kosmos</button>
    <button data-v="ups"><svg viewBox="0 0 24 24"><path d="M12 20V5M6 11l6-6 6 6"/><path d="M5 20h14"/></svg>Upgrades<span class="dot" id="updot" hidden></span></button>
    <button data-v="bang"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/></svg>Urknall</button>
    <button data-v="ach"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>Erfolge</button>
    <button data-v="opt"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>Menü</button>
  </nav>
</div>
<div id="toast"></div>
<div id="modal" hidden><div class="panel" id="modalbody"></div></div>

/* ---------- Zahlen ---------- */
function de(x,d){return x.toFixed(d).replace('.',',')}
function suffix(e){const B=['','K','M','B','T'];if(e<5)return B[e];const k=e-5;return String.fromCharCode(97+Math.floor(k/26)%26)+String.fromCharCode(97+k%26)}
function fmt(n,plain){
  if(!isFinite(n))return '∞';
  if(n<0)return '-'+fmt(-n);
  if(n<1000)return n<10&&!plain?de(n,2):n<100&&!plain?de(n,1):String(Math.floor(n));
  if(!plain&&S&&S.sci)return de(n/Math.pow(10,Math.floor(Math.log10(n))),2)+'e'+Math.floor(Math.log10(n));
  let e=Math.floor(Math.log10(n)/3),v=n/Math.pow(1000,e);
  if(v>=999.995){e++;v/=1000}
  return (plain?String(Math.round(v)):de(v,2))+suffix(e);
}
function fmtT(s){
  if(s<60)return de(s,s<10?2:1)+'s';
  if(s<3600)return Math.floor(s/60)+'m '+Math.floor(s%60)+'s';
  if(s<86400)return Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m';
  return Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h';
}

      o.ach=ach;const keep=Object.assign(fresh(),o);keep.res=o.res||{};S=fresh(keep);S.best=Math.max(o.best||0,o.run||0);migrated=true;return true}

let M={tier:[],all:1,tapK:0,glob:1,speed:1};
function msInfo(n){const mo=3+lv('mile');let sp=1,out=1,next=null;for(const m of MS){if(n>=m){if(m<=100)sp*=2;else out*=mo}else{next=m;break}}return{sp,out,next,nextFx:next==null?'':next<=100?'Tempo ×2':'Ertrag ×'+mo}}
function achCount(){return Object.keys(S.ach).length}
function recalc(){
  M.tier=TIERS.map(()=>1);M.all=1;M.tapK=0;
  for(const id in S.up){const u=UPMAP[id];if(!u)continue;if(u.kind==='tier')M.tier[u.tier]*=3;else if(u.kind==='all')M.all*=2;else M.tapK++}
  M.glob=M.all*(1+(0.1+0.01*lv('sing'))*S.sing)*(1+0.5*lv('dark'))*(1+(0.02+0.01*lv('achr'))*achCount());
  M.speed=Math.pow(1.15,lv('time'));
}
function boosting(){return Date.now()<S.boostUntil}
function stormX(){return 7+lv('storm')}
function disc(){return Math.pow(0.96,lv('cheap'))}
function cycleT(i){return TIERS[i].time/(msInfo(S.g[i].n).sp*M.speed)}
function perCycle(i,noBoost){const n=S.g[i].n;return TIERS[i].rev*n*msInfo(n).out*M.tier[i]*M.glob*(boosting()&&!noBoost?stormX():1)}
function perSec(i,nb){return S.g[i].n?perCycle(i,nb)/cycleT(i):0}
function totalPS(nb){let s=0;for(let i=0;i<N;i++)s+=perSec(i,nb);return s}
function tapValue(){return (1+totalPS(true)*(0.01+0.02*M.tapK))*(1+0.5*lv('tap'))*(boosting()?stormX():1)}
function earn(x){S.m+=x;S.run+=x;S.life+=x}
function costOf(i,k){const t=TIERS[i],n=S.g[i].n;return disc()*t.cost*Math.pow(t.r,n)*(Math.pow(t.r,k)-1)/(t.r-1)}
function maxBuy(i){const t=TIERS[i],c=disc()*t.cost*Math.pow(t.r,S.g[i].n);return Math.max(0,Math.floor(Math.log(S.m*(t.r-1)/c+1)/Math.log(t.r)+1e-9))}
function amount(i){const md=MODES[S.bm];if(md==='max')return Math.max(1,maxBuy(i));if(md==='next'){const nx=msInfo(S.g[i].n).next;return nx?nx-S.g[i].n:1}return md}
function buy(i,k){const c=costOf(i,k);if(c>S.m||k<1)return false;S.m-=c;S.g[i].n+=k;return true}
function bangGain(){if(S.run<1e12)return 0;return Math.floor(Math.pow(Math.log10(S.run)-11,2.5)*(1+0.15*lv('echo'))+1e-9)}

}

}

  let h='<div class="panel"><h2>Erfolge</h2><p>'+n+' von '+ACH.length+' freigeschaltet. Jeder Erfolg erhöht die Produktion um '+(2+lv('achr'))+' % (jetzt +'+fmt(n*(2+lv('achr')),true)+' %).</p></div><div class="achgrid">';
  ACH.forEach(a=>{h+='<div class="ach'+(S.ach[a.id]?' done':'')+'"><b>'+a.name+'</b>'+a.desc+'</div>'});
  V.innerHTML=h+'</div>';
}
let resetArm=0;
function renderOpt(){
  const V=$('#v-opt');const play=(Date.now()-S.born)/1000;

  '<div class="panel"><h3 style="margin-top:0">Sound</h3><div class="slider"><label for="o-mus">Musik</label><input type="range" id="o-mus" min="0" max="100" value="'+Math.round(S.musVol*100)+'"><span id="o-musv">'+Math.round(S.musVol*100)+' %</span></div><div class="slider"><label for="o-sfx">Effekte</label><input type="range" id="o-sfx" min="0" max="100" value="'+Math.round(S.sfxVol*100)+'"><span id="o-sfxv">'+Math.round(S.sfxVol*100)+' %</span></div><button class="btn ghost" id="o-mute" style="margin-top:10px">Ton: '+(S.mute?'aus':'an')+'</button></div>'+
  '<div class="panel"><h3 style="margin-top:0">Einstellungen</h3><div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn ghost" id="o-sci">Zahlen: '+(S.sci?'1,23e15':'1,23aa')+'</button>'+(lv('auto')?'<button class="btn ghost" id="o-auto">Auto-Kauf: '+(S.autoOn?'an':'aus')+'</button>':'')+'</div></div>'+
  '<div class="panel"><h3 style="margin-top:0">Spielstand sichern</h3><p>Kopiere den Code und bewahre ihn auf. Zum Laden einfügen und „Laden“ tippen.</p><textarea id="o-txt" spellcheck="false" aria-label="Spielstand-Code"></textarea><div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn ion" id="o-exp">Code erzeugen &amp; kopieren</button><button class="btn ghost" id="o-imp">Laden</button></div></div>'+
  '<div class="panel"><h3 style="margin-top:0">Neu beginnen</h3><p>Löscht alles, auch Singularitäten und Erfolge.</p><button class="btn danger" id="o-reset" style="margin-top:6px">'+(resetArm>Date.now()?'Sicher? Nochmal tippen':'Spiel zurücksetzen')+'</button></div>';
  V.innerHTML=h;
  $('#o-mus').oninput=e=>{S.musVol=e.target.value/100;$('#o-musv').textContent=e.target.value+' %';SND.apply()};
  $('#o-sfx').oninput=e=>{S.sfxVol=e.target.value/100;$('#o-sfxv').textContent=e.target.value+' %';SND.apply()};
  $('#o-sfx').onchange=()=>SND.play('buy');
  $('#o-mute').onclick=()=>{setMute(!S.mute);renderOpt()};
  $('#o-sci').onclick=()=>{S.sci=!S.sci;renderOpt();rows.forEach(r=>r.cache={})};
  const au=$('#o-auto');if(au)au.onclick=()=>setAuto(!S.autoOn);
  $('#o-exp').onclick=()=>{const t=$('#o-txt');t.value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));t.select();
    try{navigator.clipboard.writeText(t.value).then(()=>toast('Code kopiert'),()=>toast('Code markiert – bitte manuell kopieren'))}catch(e){toast('Code markiert – bitte manuell kopieren')}};
  $('#o-imp').onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($('#o-txt').value.trim()))));if(!o||!o.g)throw 0;load({save:JSON.stringify(o)});recalc();rowCount=-99;buildList();buildModes();setMute(S.mute);toast('Spielstand geladen');switchView('kosmos')}catch(e){toast('Der Code ist ungültig. Bitte vollständig einfügen.')}};
  $('#o-reset').onclick=()=>{if(resetArm>Date.now()){resetArm=0;S=fresh();recalc();rowCount=-99;buildList();buildModes();setMute(S.mute);save();toast('Neues Spiel gestartet');switchView('kosmos')}else{resetArm=Date.now()+4000;renderOpt();setTimeout(()=>{if(view==='opt')renderOpt()},4100)}};
}
function switchView(v){if(view!==v)SND.play('click');view=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  ['kosmos','ups','bang','ach','opt'].forEach(x=>$('#v-'+x).hidden=x!==v);$('#views').scrollTop=0;
  if(v==='ups')renderUps();if(v==='bang')renderBang();if(v==='ach')renderAch();if(v==='opt')renderOpt();if(v==='kosmos'){buildList();updList()}}

/* ---------- Himmel / Grafik ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* additives Leuchten: lässt Licht sich aufaddieren wie bei echter Belichtung */
function glow(c,x,y,r,rgb,a){if(r<=0)return;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba('+rgb+','+a+')');g.addColorStop(.35,'rgba('+rgb+','+(a*.45)+')');g.addColorStop(1,'rgba('+rgb+',0)');const o=c.globalCompositeOperation;c.globalCompositeOperation='lighter';c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.globalCompositeOperation=o}
/* Kugel mit Licht von links oben, Schattenseite, Randlicht und Glanzpunkt */
function ball(c,x,y,r,c1,c2,opt){if(r<=0)return;const g=c.createRadialGradient(x-r*.38,y-r*.42,r*.05,x-r*.1,y-r*.1,r*1.15);g.addColorStop(0,c1);g.addColorStop(.55,c2);g.addColorStop(1,shadeCol(c2));c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();
  if(!(opt&&opt.flat)){const rim=c.createRadialGradient(x+r*.25,y+r*.25,r*.75,x,y,r);rim.addColorStop(0,'rgba(255,255,255,0)');rim.addColorStop(1,'rgba(255,255,255,'+(opt&&opt.rim!=null?opt.rim:.18)+')');c.fillStyle=rim;c.beginPath();c.arc(x,y,r,0,7);c.fill();
  if(r>4){const sp=c.createRadialGradient(x-r*.42,y-r*.48,0,x-r*.42,y-r*.48,r*.35);sp.addColorStop(0,'rgba(255,255,255,.55)');sp.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=sp;c.beginPath();c.arc(x-r*.42,y-r*.48,r*.35,0,7);c.fill()}}}
function shadeCol(hex){if(hex[0]!=='#')return hex;const n=parseInt(hex.slice(1),16),f=.28;return 'rgb('+Math.round((n>>16&255)*f)+','+Math.round((n>>8&255)*f)+','+Math.round((n&255)*f)+')'}
function shade(c,x,y,r){const g=c.createRadialGradient(x-r*.45,y-r*.45,r*.35,x,y,r*1.05);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,12,.7)');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill()}
function atmo(c,x,y,r,rgb){const g=c.createRadialGradient(x,y,r*.92,x,y,r*1.18);g.addColorStop(0,'rgba('+rgb+',.55)');g.addColorStop(1,'rgba('+rgb+',0)');const o=c.globalCompositeOperation;c.globalCompositeOperation='lighter';c.fillStyle=g;c.beginPath();c.arc(x,y,r*1.18,0,7);c.fill();c.globalCompositeOperation=o}
function spark(c,x,y,s,rgb,a){if(s<=0)return;const o=c.globalCompositeOperation;c.globalCompositeOperation='lighter';c.lineWidth=Math.max(.6,Math.min(s*.12,1.2+s*.02));c.lineCap='round';

  glow(c,x,y,s*.5,rgb,a);c.globalCompositeOperation=o}

  o.nodes=[];for(let k=0;k<14;k++)o.nodes.push([R()*2-1,(R()*2-1)*.8,R()]);

  function tone(f,dur,o){o=o||{};const t=ac.currentTime+(o.at||0),osc=ac.createOscillator(),g=ac.createGain();
    osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+dur);if(o.det)osc.detune.value=o.det;
    const v=o.vol||.2,a=o.att||.005;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    osc.connect(g);g.connect(o.dest||sfx);osc.start(t);osc.stop(t+dur+.05)}
  function noise(dur,o){o=o||{};const t=ac.currentTime+(o.at||0),s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
    s.buffer=NB;s.loop=true;f.type=o.ft||'bandpass';f.Q.value=o.q||1;f.frequency.setValueAtTime(o.f0||800,t);f.frequency.exponentialRampToValueAtTime(o.f1||800,t+dur);
    const v=o.vol||.2;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(o.att||dur*.3));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(sfx);s.start(t);s.stop(t+dur+.05)}
  const scale=(k,base)=>hz(base+PENTA[((k%5)+5)%5]+12*Math.floor(k/5));
  const fx={
    tap(){const now=performance.now();if(now-lastTap<45)return;lastTap=now;const f=scale(Math.floor(Math.random()*8),69);tone(f,.25,{vol:.12});tone(f*2,.12,{vol:.04,type:'triangle'})},
    buy(){tone(hz(72),.12,{type:'triangle',vol:.12});tone(hz(79),.22,{type:'triangle',vol:.12,at:.06})},
    milestone(){[72,76,79,84].forEach((m,k)=>tone(hz(m),.9,{vol:.13,at:k*.08}));tone(hz(96),1.2,{vol:.05,at:.32})},
    unlock(){[60,67,72,76,79,84,88].forEach((m,k)=>tone(hz(m),1.4,{vol:.1,at:k*.07,type:k%2?'sine':'triangle'}));noise(1.4,{f0:2000,f1:9000,vol:.05,q:.7})},
    upgrade(){[84,88,91].forEach((m,k)=>tone(hz(m),.5,{vol:.08,at:k*.05}));tone(hz(60),.4,{vol:.08,type:'triangle'})},
    research(){[57,64,69,72].forEach(m=>tone(hz(m),1.6,{vol:.07,att:.15,type:'triangle'}));tone(hz(81),1.4,{vol:.05,at:.2})},
    ach(){[79,83,86,91].forEach((m,k)=>tone(hz(m),1.2,{vol:.07,at:k*.03}));tone(hz(67),1.2,{vol:.06,type:'triangle'})},
    cometSpawn(){noise(2.2,{f0:400,f1:3500,vol:.06,q:2,att:1.2})},
    comet(){noise(.6,{f0:6000,f1:1500,vol:.08,q:1.5,att:.02});[84,88,91,96,100].forEach((m,k)=>tone(hz(m),.7,{vol:.07,at:.05+k*.05}))},
    bang(){tone(110,3,{to:28,vol:.5,att:.02});tone(55,3.5,{to:20,vol:.4,type:'triangle',att:.02});noise(3,{ft:'lowpass',f0:3000,f1:80,vol:.45,att:.01,q:.5});
      [48,55,60,64,67,72].forEach((m,k)=>tone(hz(m),3,{vol:.05,at:1.2+k*.12,att:.6,type:'triangle'}))},
    collect(){[67,72,76,79,84].forEach((m,k)=>tone(hz(m),.8,{vol:.09,at:k*.06}))},
    click(){tone(hz(84),.06,{vol:.05,type:'triangle'})}
  };
  function play(n){init();if(!ok())return;try{fx[n]()}catch(e){}}
  /* Ambient-Musik: langsame Akkordflächen + vereinzelte Sternenklänge */
  function pad(chord,start,len){const out=[];const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=700;f.Q.value=.7;
    const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.07;lg.gain.value=350;lfo.connect(lg);lg.connect(f.frequency);lfo.start(start);lfo.stop(start+len+6);
    const g=ac.createGain();g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(.16,start+5);g.gain.setValueAtTime(.16,start+len);g.gain.linearRampToValueAtTime(0,start+len+6);
    f.connect(g);g.connect(mus);
    chord.forEach((m,k)=>{for(const d of [-7,7]){const o=ac.createOscillator();o.type=k===0?'triangle':'sawtooth';o.frequency.value=hz(m);o.detune.value=d;const og=ac.createGain();og.gain.value=k===0?.5:.12;o.connect(og);og.connect(f);o.start(start);o.stop(start+len+6.1);out.push(o)}});
    return out}
  function musicTick(){
    if(!ac||ac.state!=='running'||S.mute||S.musVol<=0)return;const t=ac.currentTime;
    if(t>=nextChord-1){const st=Math.max(t,nextChord);pad(CHORDS[chordIdx%CHORDS.length],st,12);chordIdx++;nextChord=st+14}
    if(t>=nextPluck){const ch=CHORDS[(chordIdx+3)%CHORDS.length];const m=ch[1+Math.floor(Math.random()*3)]+24+(Math.random()<.3?12:0);
      tone(hz(m),3.5,{vol:.045,att:.01,dest:mus});if(Math.random()<.4)tone(hz(m+7),3,{vol:.03,at:.35,dest:mus});nextPluck=t+2.5+Math.random()*4.5}
  }
  document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();else ac.resume().then(()=>{nextChord=ac.currentTime})});
  ['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,init,{capture:true,passive:true}));
  return{play,apply,init};
})();

const ICON_ON='<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',ICON_OFF='<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>';
function setMute(m){S.mute=m;$('#mute').innerHTML=m?ICON_OFF:ICON_ON;$('#mute').setAttribute('aria-pressed',m);SND.init();SND.apply()}
$('#mute').addEventListener('click',()=>setMute(!S.mute));
/* ---------- Start ---------- */
function start(data){
  const had=load(data);recalc();
  if(had){const away=Math.min((Date.now()-S.last)/1000,(4+2*lv('off'))*3600);
    if(away>30){const ps=totalPS(true),gain=ps*away;if(gain>0){earn(gain);setTimeout(()=>modal('<h2>Willkommen zurück</h2><p>Dein Universum ist '+fmtT(away)+' lang ohne dich gewachsen.</p><div class="big num" style="color:var(--star)">+'+fmt(gain)+'</div><p>Materie</p>','Einsammeln',()=>SND.play('collect')),300)}}}
  buildModes();buildList();updList();updTop();resize();scheduleComet();$('#mute').innerHTML=S.mute?ICON_OFF:ICON_ON;
  if(migrated)setTimeout(()=>modal('<h2>100 Objekte</h2><p>Das Universum ist gewachsen: Zwischen Quark und Omniversum liegen jetzt viele neue Stufen, und ganz am Ende wartet der Ursprung.</p><p>Dein Universum beginnt neu. Singularitäten, Quantenpunkte, Forschung und Erfolge bleiben erhalten.</p>','Los geht’s'),300);
  if(!had)setTimeout(()=>modal('<h2>Kosmos Schmiede</h2><p>Kaufe deinen ersten Quark. Jedes Objekt erzeugt in Zyklen Materie. Mit Materie kaufst du mehr Objekte und entdeckst immer größere: 100 Stufen vom Quark bis zum Ursprung.</p><p>Tippe auf den Himmel für Extra-Materie und fange vorbeifliegende Kometen ein.</p>','Los geht’s'),200);
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.v));
  new ResizeObserver(resize).observe(cv);
  let last=performance.now(),acc=0,acc2=0,acc3=0;
  function frame(now){const dt=Math.min(1,(now-last)/1000);last=now;
    if(dt>0){tick(dt);autoBuy(dt);}
    acc+=dt;acc2+=dt;acc3+=dt;
    if(acc>0.1){acc=0;updTop();if(view==='kosmos'){buildList();updList()}}
    if(acc2>1){acc2=0;checkAch();if(view==='ups')renderUps();if(view==='bang'&&bangArm<Date.now())renderBang()}
    if(acc3>5){acc3=0;save()}
    if(!cometObj&&Date.now()>cometNext&&S.g[0].n)spawnComet();moveComet(now);
    if(view==='kosmos')updBars();drawSky(now/1000,dt);requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{const away=Math.min((Date.now()-S.last)/1000,(4+2*lv('off'))*3600);if(away>2){tick(Math.min(away,5));const rest=away-Math.min(away,5);if(rest>0)earn(totalPS(true)*rest)}last=performance.now()}});
  window.addEventListener('pagehide',save);
}
window.save=save;
window.onAndroidBack=()=>{if(!$('#modal').hidden){$('#mok').click();return true}if(view!=='kosmos'){switchView('kosmos');return true}save();return false};
window.claude?.hot?.snapshot?.(()=>({save:JSON.stringify(S)}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
