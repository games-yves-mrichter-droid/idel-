<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1430">
<title>Onsen Idle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#1d0f22;--panel:#2e1834;--panel2:#3b2142;--line:#563260;
  --text:#fbeef7;--muted:#c9a8c4;--accent:#ff6fa8;--accent2:#ffb347;
  --good:#5fd38d;--gem:#6fd3ff;--ticket:#ffd36f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:linear-gradient(#2a1430,#24112aee);padding:8px 12px;border-bottom:1px solid var(--line)}
.res{display:flex;gap:8px;justify-content:space-between}
.res div{flex:1;background:var(--panel);border-radius:10px;padding:5px 8px;text-align:center;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.inc{text-align:center;color:var(--muted);font-size:12px;margin-top:4px}
main{flex:1;padding:12px 12px 90px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;justify-content:center;background:#24112a;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:flex;max-width:560px;width:100%}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:10px 0 8px;font-size:12px;cursor:pointer}
nav button b{display:block;font-size:22px}
nav button.on{color:var(--accent)}
h2{margin:6px 0 10px;font-size:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:12px}
button.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:13px;min-width:92px}
button.btn.alt{background:var(--panel2);border:1px solid var(--line)}
button.btn.gold{background:linear-gradient(#ffb347,#e8892a)}
button.btn.gem{background:linear-gradient(#5ac8f5,#2e8ec4)}
button.btn:disabled{opacity:.4;cursor:default}
.scene{position:relative;border-radius:16px;overflow:hidden;height:300px;background:linear-gradient(#3a2a5a,#6a3a6a 55%,#2e6f80 56%,#3b8a9a);margin-bottom:10px;border:1px solid var(--line)}
.scene svg.girl{position:absolute;left:50%;bottom:-6px;height:290px;transform:translateX(-50%)}
.steam{position:absolute;border-radius:50%;background:#fff;filter:blur(14px);opacity:.18;animation:steam 7s ease-in-out infinite}
@keyframes steam{0%{transform:translateY(20px) scale(.8);opacity:0}40%{opacity:.25}100%{transform:translateY(-140px) scale(1.4);opacity:0}}
.tapbtn{position:absolute;right:10px;bottom:10px;z-index:2}
.float{position:fixed;pointer-events:none;font-weight:800;color:var(--accent2);text-shadow:0 1px 3px #000;animation:fl 1s ease-out forwards;z-index:50}
@keyframes fl{to{transform:translateY(-60px);opacity:0}}
.avatar{width:52px;height:52px;border-radius:12px;background:var(--panel2);overflow:hidden;flex:none;border:1px solid var(--line)}
.avatar svg{width:100%;height:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gcard{background:var(--panel);border:2px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;position:relative}
.gcard svg{display:block;width:100%;height:220px;background:linear-gradient(#4a2a5a,#7a3f6e)}
.gcard .info{padding:6px 8px}
.gcard.locked svg{filter:brightness(0) opacity(.5)}
.rar{display:inline-block;font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;color:#000}
.rar.R{background:#9fd3a8}.rar.SR{background:#7fc3ff}.rar.SSR{background:#ffcf5a}.rar.UR{background:linear-gradient(90deg,#ff7ab6,#b28bff,#6fe1ff)}
.stars{color:var(--ticket);font-size:12px}
.modal{position:fixed;inset:0;background:#000b;z-index:40;display:flex;align-items:center;justify-content:center;padding:14px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:14px}
.big{display:block;width:100%;height:420px;border-radius:14px;background:linear-gradient(#3a2a5a,#6a3a6a 60%,#2e6f80 61%,#3b8a9a)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{flex:1;min-width:70px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 4px;font-size:12px;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent)}
.tabs button:disabled{opacity:.45}
.seg{display:flex;gap:4px;margin-bottom:10px}
.seg button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--accent)}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px;width:100%}
.bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.switch{display:flex;align-items:center;justify-content:space-between}
.glow{animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 10px var(--accent)}to{box-shadow:0 0 30px var(--accent2)}}
.water{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(#7fe0e8aa,#1f6c80dd);border-top:2px solid #ffffff55;pointer-events:none}
.gcard.R{border-color:#7fbf8a}.gcard.SR{border-color:#5aa8f0}.gcard.SSR{border-color:#ffcf5a;box-shadow:0 0 10px #ffcf5a55}.gcard.UR{border-color:#ff7ab6;box-shadow:0 0 14px #b28bff88}
.gcard .info{background:linear-gradient(#00000000,#00000066)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="res">
      <div><small>💰 Gold</small><span id="rGold">0</span></div>
      <div><small>💎 Juwelen</small><span id="rGems">0</span></div>
      <div><small>🎟️ Tickets</small><span id="rTix">0</span></div>
    </div>
    <div class="inc" id="rInc"></div>
  </header>
  <main id="main"></main>
</div>
<nav><div class="wrap">
  <button data-tab="onsen" class="on"><b>♨️</b>Onsen</button>
  <button data-tab="girls"><b>💃</b>Mädchen</button>
  <button data-tab="summon"><b>🌸</b>Beschwören</button>
  <button data-tab="free"><b>🎁</b>Gratis</button>
</div></nav>
<div id="modalRoot"></div>

<script>
'use strict';
/* ================= Daten ================= */
const STAGES=[
  {lvl:1, name:'Freizeit'},
  {lvl:10,name:'Yukata'},
  {lvl:25,name:'Badeanzug'},
  {lvl:50,name:'Bikini'},
  {lvl:80,name:'Badetuch'}
];
const RAR={R:{m:1,cost:25,w:55},SR:{m:1.5,cost:60,w:30},SSR:{m:2.5,cost:150,w:12},UR:{m:4,cost:400,w:3}};
const GIRLS=[
  {id:'hana', name:'Hana', age:21,rarity:'R',  hair:'#5b3a29',style:'twin',     eye:'#a0602e',skin:'#f6d5bd',color:'#f2b134',pose:0,bio:'Studentin, jobbt am Empfang und kennt jeden Stammgast beim Namen.'},
  {id:'sakura',name:'Sakura',age:23,rarity:'R',hair:'#f4a6c6',style:'long',     eye:'#d14d8b',skin:'#f8dccb',color:'#e85d9a',pose:1,bio:'Fröhliche Kirschblüten-Liebhaberin, schmückt jedes Becken mit Blüten.'},
  {id:'yuki', name:'Yuki', age:25,rarity:'SR', hair:'#e6eeff',style:'bob',      eye:'#4a8fe0',skin:'#fbe4d6',color:'#6aa8f0',pose:2,bio:'Kühl auf den ersten Blick, liebt aber heiße Quellen über alles.'},
  {id:'mei',  name:'Mei',  age:24,rarity:'SR', hair:'#f6d36b',style:'ponytail', eye:'#2e9e6b',skin:'#f8dccb',color:'#2fb57c',pose:0,bio:'Sportlich und energiegeladen – macht morgens Yoga am Becken.'},
  {id:'akane',name:'Akane',age:27,rarity:'SR', hair:'#c0392b',style:'ponytail', eye:'#e67e22',skin:'#f1c9a8',color:'#d6453d',pose:1,bio:'Feurige Köchin, ihr Onsen-Ei ist legendär.'},
  {id:'rin',  name:'Rin',  age:26,rarity:'SSR',hair:'#1f1b33',style:'long',     eye:'#9b59d0',skin:'#f3d2bd',color:'#7b4fc9',pose:2,bio:'Geheimnisvolle Wahrsagerin, die nur bei Mondschein badet.'},
  {id:'nami', name:'Nami', age:28,rarity:'SSR',hair:'#ff8a3d',style:'bob',      eye:'#1f8a9c',skin:'#d9a07a',color:'#ff6f61',pose:0,bio:'Surferin von der Küste, bringt Sommerstimmung in jede Jahreszeit.'},
  {id:'kaori',name:'Kaori',age:29,rarity:'UR', hair:'#3d2b56',style:'twin',     eye:'#e0405a',skin:'#a8714f',color:'#c0392b',pose:1,bio:'Die elegante Besitzerin der Kaiserlichen Quelle. Sehr anspruchsvoll.'}
];
const BATHS=[
  {id:'foot', name:'Fußbad',              icon:'🦶',base:1,     cost:10},
  {id:'rock', name:'Felsenquelle',        icon:'🪨',base:8,     cost:150},
  {id:'wood', name:'Holzbottich',         icon:'🪵',base:50,    cost:2000},
  {id:'milk', name:'Milchbad',            icon:'🥛',base:300,   cost:3e4},
  {id:'rose', name:'Rosenbad',            icon:'🌹',base:2000,  cost:5e5},
  {id:'sake', name:'Sakebad',             icon:'🍶',base:15000, cost:8e6},
  {id:'moon', name:'Mondschein-Rotenburo',icon:'🌙',base:1.2e5, cost:1.5e8},
  {id:'royal',name:'Kaiserliche Quelle',  icon:'👑',base:1e6,   cost:3e9}
];
const GIRL_MAX=100, BATH_R=1.13, GIRL_R=1.12, OFFLINE_CAP=12*3600;

/* ================= Zustand ================= */
const SAVE_KEY='onsenIdleSave_v1';
function fresh(){return{gold:50,gems:300,tickets:3,baths:{foot:1},girls:{hana:{lvl:1,stars:1}},assign:{foot:'hana'},infinite:false,buyMode:1,favorite:'hana',last:Date.now(),gemTimer:0}}
let S;
try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(SAVE_KEY)||'null')||{})}catch(e){S=fresh()}
function save(){S.last=Date.now();try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}

/* ================= Hilfen ================= */
const $=s=>document.querySelector(s);
const G=id=>GIRLS.find(g=>g.id===id);
const B=id=>BATHS.find(b=>b.id===id);
function fmt(n){
  if(!isFinite(n))return '∞';
  if(n<1000)return n<10&&n%1?n.toFixed(1):Math.floor(n).toString();
  const u=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];let i=0;
  while(n>=1000&&i<u.length-1){n/=1000;i++}
  if(n>=1000)return n.toExponential(2);
  return n.toFixed(n<10?2:n<100?1:0)+u[i];
}
function geo(c,r,l,n){return c*Math.pow(r,l)*(Math.pow(r,n)-1)/(r-1)}
function maxAfford(c,r,l,money){const f=c*Math.pow(r,l);if(money<f)return 0;return Math.floor(Math.log(money*(r-1)/f+1)/Math.log(r))}
function stageFor(l){let s=0;STAGES.forEach((st,i)=>{if(l>=st.lvl)s=i});return s}
function shade(hex,a){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(a<0?v*(1+a):v+(255-v)*a)));return'#'+((1<<24)+(f(r)<<16)+(f(g)<<8)+f(b)).toString(16).slice(1)}
function canPay(kind,amt){return S.infinite||S[kind]>=amt}
function pay(kind,amt){if(S.infinite)return true;if(S[kind]<amt)return false;S[kind]-=amt;return true}

/* ================= Wirtschaft ================= */
function hostMult(bathId){
  const gid=S.assign[bathId];const o=gid&&S.girls[gid];if(!o)return 1;
  return 1+o.lvl*0.05*RAR[G(gid).rarity].m*(1+0.2*(o.stars-1));
}
function bathIncome(b){const l=S.baths[b.id]||0;if(!l)return 0;return b.base*l*Math.pow(2,Math.floor(l/25))*hostMult(b.id)}
function collectionBonus(){return 1+0.1*Object.keys(S.girls).length}
function income(){return BATHS.reduce((a,b)=>a+bathIncome(b),0)*collectionBonus()}
function buyN(c,r,l,cap){
  let n;
  if(S.buyMode==='max')n=S.infinite?(cap?cap-l:100):Math.max(1,maxAfford(c,r,l,S.gold));
  else n=S.buyMode;
  if(cap)n=Math.min(n,cap-l);
  return Math.max(0,n);
}
function bathOffer(b){const l=S.baths[b.id]||0;const n=buyN(b.cost,BATH_R,l);return{n,cost:geo(b.cost,BATH_R,l,n)}}
function girlOffer(g){const o=S.girls[g.id];const n=buyN(RAR[g.rarity].cost,GIRL_R,o.lvl-1,GIRL_MAX-1);return{n,cost:geo(RAR[g.rarity].cost,GIRL_R,o.lvl-1,n)}}

/* ================= Figur (SVG) ================= */
let C='',UID=0;
/* Halbrealistischer Anime-Stil: weiche, geblurrte Schattierung innerhalb von Clip-Formen,
   Glanzlichter, 7-Kopf-Proportionen. Alle Koordinaten als x,y-Paare, damit mir() spiegeln kann. */
const mir=d=>d.replace(/(-?\d+\.?\d*),(-?\d+\.?\d*)/g,(m,x,y)=>`${+(200-x).toFixed(1)},${y}`);
const POSES=[
  {armL:'M76,110 Q60,148 70,174 Q78,188 90,186',armR:'M124,110 Q146,90 138,58 Q133,44 118,40',hL:[90,186],hR:[118,40],front:false,rot:-2,legs:'crossed'},
  {armL:'M76,110 Q58,74 84,32',armR:'M124,110 Q142,74 116,32',hL:[84,30],hR:[116,30],front:false,rot:0,legs:'stand'},
  {armL:'M76,110 Q62,160 96,198',armR:'M124,110 Q138,160 104,198',hL:[96,198],hR:[104,198],front:true,rot:-4,legs:'stand',wink:true}
];
const HEAD='M81,56 Q81,34 100,34 Q119,34 119,56 Q119,71 111,80 Q105,87 100,88 Q95,87 89,80 Q81,71 81,56Z';
const NECK='M94.5,80 L94,104 L106,104 L105.5,80Z';
const TORSO='M93,100 Q84,104 74,108 Q67,113 70,126 Q72,140 76,152 Q81,166 86,178 Q84,192 76,206 Q72,216 74,232 L126,232 Q128,216 124,206 Q116,192 114,178 Q119,166 124,152 Q128,140 130,126 Q133,113 126,108 Q116,104 107,100Z';
const LEGS={
  stand:['M74,226 Q69,262 77,300 Q80,334 84,374 L95,375 Q96,334 97,300 Q101,262 100,236Z','M126,226 Q131,262 123,300 Q120,334 116,374 L105,375 Q104,334 103,300 Q99,262 100,236Z'],
  crossed:['M74,226 Q69,262 79,300 Q84,334 90,374 L101,375 Q99,334 98,300 Q101,262 100,236Z','M126,226 Q128,264 112,300 Q102,334 96,374 L85,375 Q90,334 98,298 Q103,262 100,236Z']
};
function hairShapes(g){
  const s=g.style,base='M79,56 Q75,25 100,23 Q125,25 121,56 L122,84 Q100,88 78,84Z';
  const back={
    long:['M79,56 Q74,24 100,22 Q126,24 121,56 Q132,110 137,182 Q118,172 100,176 Q82,172 63,182 Q68,110 79,56Z'],
    bob:['M79,56 Q74,24 100,22 Q126,24 121,56 L126,98 Q100,106 74,98Z'],
    ponytail:[base,'M114,28 Q150,30 144,96 Q140,142 124,172 Q133,104 116,50Z'],
    twin:[base,'M82,40 Q52,62 58,132 Q62,162 70,178 Q70,110 85,60Z',mir('M82,40 Q52,62 58,132 Q62,162 70,178 Q70,110 85,60Z')]
  }[s];
  const front=['M78,64 Q72,21 100,20 Q128,21 122,64 Q118,48 112,53 Q108,40 100,51 Q93,40 88,53 Q82,48 78,64Z'];
  if(s==='long'||s==='bob')front.push('M80,54 Q73,86 77,116 L84,110 Q80,86 85,58Z',mir('M80,54 Q73,86 77,116 L84,110 Q80,86 85,58Z'));
  return{back,front};
}
function outfitDef(g,st){
  const c=g.color,d=shade(c,-.35),l=shade(c,.4);
  switch(st){
    case 0:return{
      shapes:[['M93,100 Q84,104 74,108 Q67,113 70,126 Q72,140 76,152 Q81,166 86,178 Q84,190 80,202 L120,202 Q116,190 114,178 Q119,166 124,152 Q128,140 130,126 Q133,113 126,108 Q116,104 107,100 Q100,108 93,100Z',c],
              ['M79,196 L121,196 Q129,224 135,254 Q100,262 65,254 Q71,224 79,196Z','#2f3f6e']],
      extra:`<path d="M93,100 Q100,110 107,100" stroke="${d}" stroke-width="2" fill="none"/><g stroke="#1f2b50" stroke-width="1.2" opacity=".7"><path d="M90,200 L84,256"/><path d="M100,200 L100,258"/><path d="M110,200 L116,256"/></g><path d="M79,198 L121,198" stroke="#1f2b50" stroke-width="3"/>`};
    case 1:return{
      shapes:[['M93,100 Q84,104 74,108 Q67,113 70,126 Q72,150 80,178 Q76,206 74,240 Q74,300 72,354 Q100,360 128,354 Q126,300 126,240 Q124,206 120,178 Q128,150 130,126 Q133,113 126,108 Q116,104 107,100Z',l]],
      extra:`<g fill="${c}" opacity=".75">${[[84,236],[114,266],[90,300],[116,214],[84,140],[118,130],[104,330]].map(([x,y])=>`<path d="M${x},${y-5} Q${x+2},${y-2} ${x+5},${y} Q${x+2},${y+2} ${x},${y+5} Q${x-2},${y+2} ${x-5},${y} Q${x-2},${y-2} ${x},${y-5}Z"/>`).join('')}</g>
        <path d="M88,100 L100,150 L112,100" stroke="${d}" stroke-width="5" fill="none"/><path d="M100,150 L108,354" stroke="${d}" stroke-width="1.5" opacity=".5"/>
        <rect x="76" y="166" width="48" height="22" rx="3" fill="${d}"/><path d="M76,174 L124,174" stroke="${l}" stroke-width="2"/><path d="M116,170 Q134,186 126,206 L116,188Z" fill="${d}"/>`};
    case 2:return{
      shapes:[['M80,108 L86,108 Q100,142 114,108 L120,108 Q128,116 128,126 Q126,142 122,154 Q116,166 114,178 Q116,192 124,206 Q126,214 126,220 L110,228 Q100,242 90,228 L74,220 Q74,214 76,206 Q84,192 86,178 Q84,166 78,154 Q74,142 72,126 Q72,116 80,108Z',c]],
      extra:`<path d="M80,108 Q79,102 85,100" stroke="${c}" stroke-width="4" fill="none"/><path d="M120,108 Q121,102 115,100" stroke="${c}" stroke-width="4" fill="none"/><path d="M76,206 Q100,214 124,206" stroke="${l}" stroke-width="2" fill="none" opacity=".6"/>`};
    case 3:{const top='M71,126 Q84,116 99,131 Q97,149 86,151 Q74,149 71,137Z';return{
      shapes:[[top,c],[mir(top),c],['M76,214 Q100,222 124,214 L120,226 Q108,230 100,240 Q92,230 80,226Z',c]],
      extra:`<path d="M99,131 L101,131" stroke="${d}" stroke-width="2.4"/><path d="M80,120 L90,96" stroke="${d}" stroke-width="1.6"/><path d="M120,120 L110,96" stroke="${d}" stroke-width="1.6"/><path d="M71,134 L67,138 M129,134 L133,138 M76,214 L72,210 M124,214 L128,210" stroke="${d}" stroke-width="1.6"/>`};}
    case 4:return{
      shapes:[['M70,126 Q100,118 130,126 Q128,146 122,160 Q116,170 114,180 Q118,196 126,212 L130,260 Q100,268 70,260 L74,212 Q82,196 86,180 Q84,170 78,160 Q72,146 70,126Z','#f8fafc']],
      extra:`<path d="M70,126 Q100,118 130,126 L129,132 Q100,124 71,132Z" fill="${l}"/><path d="M71,252 Q100,260 129,252 L130,260 Q100,268 70,260Z" fill="${l}"/><path d="M94,124 L104,146 L108,126Z" fill="#e9eef3"/><g stroke="#d5dde6" stroke-width="1.2" fill="none"><path d="M100,132 Q102,190 106,262"/><path d="M84,190 Q86,220 82,256"/><path d="M118,170 Q114,210 120,258"/></g>`};
  }
}
function shadeLayer(id,inner){return`<g clip-path="url(#${C}${id})"><g filter="url(#${C}f)">${inner}</g></g>`}
function girlSVG(g,st,o={}){
  const p=POSES[g.pose];C='q'+(++UID);
  const sk=g.skin,sh=shade(sk,-.28),hl=shade(sk,.35),ol=shade(sk,-.42);
  const hs=hairShapes(g),of=outfitDef(g,st);
  const legs=LEGS[p.legs];
  const bodyPaths=[TORSO,...legs,NECK,HEAD];
  const back=p.front?[]:['L','R'],front=p.front?['L','R']:[];
  const arm=k=>{const d=p['arm'+k],h=p['h'+k];let s=`<path d="${d}" stroke="${ol}" stroke-width="10.6" fill="none" stroke-linecap="round"/><circle cx="${h[0]}" cy="${h[1]}" r="5.6" fill="${ol}"/>
      <path d="${d}" stroke="${sk}" stroke-width="8.8" fill="none" stroke-linecap="round"/><circle cx="${h[0]}" cy="${h[1]}" r="4.7" fill="${sk}"/>

function renderOnsen(){
  const fav=G(S.favorite)&&S.girls[S.favorite]?G(S.favorite):G(Object.keys(S.girls)[0]);

  </div>`;
  h+=buyModeSeg();
  for(const b of BATHS){
    const l=S.baths[b.id]||0;const gid=S.assign[b.id];
    h+=`<div class="card"><div class="row">
      <div class="avatar" style="display:flex;align-items:center;justify-content:center;font-size:26px">${gid?headSVG(G(gid)):b.icon}</div>
      <div class="grow"><b>${b.icon} ${b.name}</b> <span class="muted">Lv ${l}</span>
        <div class="muted" data-binc="${b.id}"></div>

      </div>
      <button class="btn gold" data-bath="${b.id}"></button>
    </div></div>`;
  }
  main.innerHTML=h;bindBuyMode();
  main.querySelector('.scene svg').onclick=()=>openGirl(fav.id);
  $('#tap').onclick=e=>{const v=Math.max(1,income()*0.5);S.gold+=v;floatText(e,'+'+fmt(v))};

      <div class="info"><span class="rar ${g.rarity}">${g.rarity}</span> <b>${o?g.name:'???'}</b>

function renderSummon(){
  main.innerHTML=`<h2>🌸 Beschwören</h2>
  <div class="card"><div class="muted">Chancen: R ${RAR.R.w}% · SR ${RAR.SR.w}% · SSR ${RAR.SSR.w}% · UR ${RAR.UR.w}%<br>Doppelte Mädchen erhalten einen Stern (max. 5★, je +20% Bonus). Bei 5★ gibt es stattdessen 200 💎.</div></div>
  <div class="card row"><div class="grow"><b>Einzel-Beschwörung</b><div class="muted">1 🎟️ oder 100 💎</div></div>
    <button class="btn" id="s1t">1 🎟️</button><button class="btn gem" id="s1g">100 💎</button></div>
  <div class="card row"><div class="grow"><b>10er-Beschwörung</b><div class="muted">10 🎟️ oder 900 💎</div></div>
    <button class="btn" id="s10t">10 🎟️</button><button class="btn gem" id="s10g">900 💎</button></div>`;
  $('#s1t').onclick=()=>pay('tickets',1)&&summon(1);
  $('#s1g').onclick=()=>pay('gems',100)&&summon(1);
  $('#s10t').onclick=()=>pay('tickets',10)&&summon(10);
  $('#s10g').onclick=()=>pay('gems',900)&&summon(10);
}
function rollRarity(){let r=Math.random()*100;for(const k of ['UR','SSR','SR','R']){if(r<RAR[k].w)return k;r-=RAR[k].w}return'R'}
function summon(n){
  const res=[];
  for(let i=0;i<n;i++){
    const rar=rollRarity();const pool=GIRLS.filter(g=>g.rarity===rar);const g=pool[Math.floor(Math.random()*pool.length)];
    const o=S.girls[g.id];let note='NEU!';
    if(!o)S.girls[g.id]={lvl:1,stars:1};
    else if(o.stars<5){o.stars++;note='+1 ★'}
    else{S.gems+=200;note='+200 💎'}
    res.push({g,note});
  }
  save();
  modal(`<h2 style="text-align:center">Beschwörung!</h2><div class="grid">${res.map(r=>`<div class="gcard ${r.g.rarity} ${r.g.rarity==='UR'||r.g.rarity==='SSR'?'glow':''}">${girlSVG(r.g,stageFor(S.girls[r.g.id].lvl))}<div class="info"><span class="rar ${r.g.rarity}">${r.g.rarity}</span> <b>${r.g.name}</b><div class="muted">${r.note}</div></div></div>`).join('')}</div>
    <button class="btn" style="width:100%;margin-top:12px" data-close>OK</button>`);
  updateDyn();
}

  <div class="card"><b>💎 Juwelen</b><div class="row" style="margin-top:8px;flex-wrap:wrap">
    <button class="btn gem" data-add="gems:1000">+1.000</button><button class="btn gem" data-add="gems:100000">+100.000</button></div></div>
  <div class="card"><b>🎟️ Tickets</b><div class="row" style="margin-top:8px;flex-wrap:wrap">
    <button class="btn" data-add="tickets:10">+10</button><button class="btn" data-add="tickets:100">+100</button><button class="btn" data-add="tickets:1000">+1.000</button></div></div>
  <div class="card"><b>⚡ Abkürzungen</b><div class="row" style="margin-top:8px;flex-wrap:wrap">
    <button class="btn" id="allGirls">Alle Mädchen freischalten</button>
    <button class="btn" id="maxGirls">Alle Mädchen Max-Level</button>
    <button class="btn" id="maxBaths">Alle Bäder +100 Level</button>
    <button class="btn" id="autoAssign">Gastgeberinnen auto-zuweisen</button></div></div>
  <div class="card"><b>⚙️ Spielstand</b><div class="muted">Wird automatisch lokal auf deinem Gerät gespeichert – komplett offline.</div>
    <div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn alt" id="exp">Exportieren</button><button class="btn alt" id="imp">Importieren</button><button class="btn" style="background:#b03a4a" id="reset">Zurücksetzen</button></div></div>`;
  $('#inf').onclick=()=>{S.infinite=!S.infinite;save();render()};
  main.querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{const[k,v]=b.dataset.add.split(':');S[k]+=+v;floatText(e,'+'+fmt(+v));save();updateDyn()});
  main.querySelectorAll('[data-mul]').forEach(b=>b.onclick=e=>{const[k,v]=b.dataset.mul.split(':');S[k]=Math.max(1,S[k])*+v;floatText(e,'×'+v);save();updateDyn()});
  $('#allGirls').onclick=()=>{GIRLS.forEach(g=>{if(!S.girls[g.id])S.girls[g.id]={lvl:1,stars:1}});toast('Alle Mädchen freigeschaltet!')};
  $('#maxGirls').onclick=()=>{Object.values(S.girls).forEach(o=>{o.lvl=GIRL_MAX;o.stars=5});toast('Alle Mädchen auf Lv 100 & 5★!')};
  $('#maxBaths').onclick=()=>{BATHS.forEach(b=>S.baths[b.id]=(S.baths[b.id]||0)+100);toast('Alle Bäder +100 Level!')};
  $('#autoAssign').onclick=()=>{autoAssign();toast('Gastgeberinnen zugewiesen!')};
  $('#exp').onclick=()=>{save();modal(`<h2>Export</h2><textarea style="width:100%;height:140px" readonly>${btoa(unescape(encodeURIComponent(JSON.stringify(S))))}</textarea><button class="btn" style="width:100%;margin-top:8px" data-close>Schließen</button>`)};
  $('#imp').onclick=()=>{const t=prompt('Spielstand-Code einfügen:');if(!t)return;try{S=Object.assign(fresh(),JSON.parse(decodeURIComponent(escape(atob(t.trim())))));save();toast('Importiert!')}catch(e){alert('Ungültiger Code')}};
  $('#reset').onclick=()=>{if(confirm('Wirklich alles zurücksetzen?')){S=fresh();save();render()}};
}
function autoAssign(){
  const ranked=Object.keys(S.girls).sort((a,b)=>hostPower(b)-hostPower(a));
  const baths=BATHS.filter(b=>S.baths[b.id]).sort((a,b)=>b.base-a.base);
  S.assign={};baths.forEach((b,i)=>{if(ranked[i])S.assign[b.id]=ranked[i]});save();
}
function hostPower(id){const o=S.girls[id];return o.lvl*RAR[G(id).rarity].m*(1+0.2*(o.stars-1))}

function openGirl(id){
  const g=G(id),o=S.girls[id];let view=stageFor(o.lvl);
  const cur=Object.keys(S.assign).find(k=>S.assign[k]===id)||'';
  const draw=()=>{
    const st=stageFor(o.lvl),next=STAGES[st+1];
    const of=girlOffer(g);
    modal(`<div class="row"><div class="grow"><span class="rar ${g.rarity}">${g.rarity}</span> <b style="font-size:18px">${g.name}</b>, ${g.age}
      <div class="stars">${'★'.repeat(o.stars)}${'☆'.repeat(5-o.stars)}</div></div><button class="btn alt" data-close style="min-width:0">✕</button></div>
      <div class="big">${girlSVG(g,view,{cls:'',vb:'12 10 176 378'}).replace('<svg ','<svg style="width:100%;height:100%" ')}</div>
      <div class="tabs">${STAGES.map((s,i)=>`<button data-st="${i}" class="${i===view?'on':''}" ${o.lvl>=s.lvl?'':'disabled'}>${o.lvl>=s.lvl?'':'🔒'}${s.name}<br><small>Lv ${s.lvl}</small></button>`).join('')}</div>
      <div class="muted">${g.bio}</div>
      <div class="card" style="margin-top:10px"><div class="row"><div class="grow"><b>Level ${o.lvl}/${GIRL_MAX}</b>
        <div class="muted">${next?`Nächstes Outfit „${next.name}“ ab Lv ${next.lvl}`:'Alle Outfits freigeschaltet'}</div>
        <div class="muted">Gastgeberin-Bonus: ×${(1+o.lvl*0.05*RAR[g.rarity].m*(1+0.2*(o.stars-1))).toFixed(2)}</div></div>
        <button class="btn gold" id="lvUp" ${o.lvl>=GIRL_MAX||of.n<1||!canPay('gold',of.cost)?'disabled':''}>${o.lvl>=GIRL_MAX?'MAX':`+${of.n} Lv<br>${fmt(of.cost)} 💰`}</button></div></div>
      <div class="card"><b>Becken zuweisen</b><select id="asg" style="margin-top:6px"><option value="">— keins —</option>
        ${BATHS.filter(b=>S.baths[b.id]).map(b=>`<option value="${b.id}" ${S.assign[b.id]===id?'selected':''}>${b.icon} ${b.name}${S.assign[b.id]&&S.assign[b.id]!==id?' (ersetzt '+G(S.assign[b.id]).name+')':''}</option>`).join('')}</select></div>
      <button class="btn alt" id="fav" style="width:100%">${S.favorite===id?'❤️ Favoritin (auf Startbild)':'🤍 Als Favoritin setzen'}</button>`);
    document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{view=+b.dataset.st;draw()});
    $('#lvUp').onclick=()=>{const f=girlOffer(g);if(f.n>0&&pay('gold',f.cost)){const before=stageFor(o.lvl);const tens=Math.floor(o.lvl/10);o.lvl+=f.n;S.gems+=5*(Math.floor(o.lvl/10)-tens);if(stageFor(o.lvl)>before){view=stageFor(o.lvl);toast(`Neues Outfit: ${STAGES[view].name}!`)}save();draw();updateDyn()}};
    $('#asg').onchange=e=>{for(const k in S.assign)if(S.assign[k]===id)delete S.assign[k];if(e.target.value)S.assign[e.target.value]=id;save();draw()};
    $('#fav').onclick=()=>{S.favorite=id;save();draw()};
  };
  draw();
}

function modal(html){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="modal"><div class="box">${html}</div></div>`;
  const m=root.firstChild;
  m.onclick=e=>{if(e.target===m||e.target.closest('[data-close]')){root.innerHTML='';render()}};
}
function toast(t){const d=document.createElement('div');d.className='float';d.style.left='50%';d.style.top='45%';d.style.transform='translateX(-50%)';d.style.fontSize='20px';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000);save();render()}
function floatText(e,t){const d=document.createElement('div');d.className='float';d.style.left=(e.clientX-20)+'px';d.style.top=(e.clientY-20)+'px';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}

function updateDyn(){
  $('#rGold').textContent=S.infinite?'∞':fmt(S.gold);
  $('#rGems').textContent=S.infinite?'∞':fmt(S.gems);
  $('#rTix').textContent=S.infinite?'∞':fmt(S.tickets);
  $('#rInc').textContent=`+${fmt(income())} Gold/Sek · Sammelbonus ×${collectionBonus().toFixed(1)}`;
  main.querySelectorAll('[data-bath]').forEach(btn=>{
    const b=B(btn.dataset.bath),o=bathOffer(b),l=S.baths[b.id]||0;
    btn.innerHTML=`${l?'+'+o.n+' Lv':'Bauen'}<br>${fmt(o.cost)} 💰`;
    btn.disabled=o.n<1||!canPay('gold',o.cost);
  });
  main.querySelectorAll('[data-binc]').forEach(el=>{const b=B(el.dataset.binc);const l=S.baths[b.id]||0;el.textContent=l?`${fmt(bathIncome(b)*collectionBonus())} Gold/Sek · nächster ×2 bei Lv ${(Math.floor(l/25)+1)*25}`:`Noch nicht gebaut`});
}

/* ================= Spielschleife ================= */
let lastTick=performance.now();
setInterval(()=>{
  const now=performance.now(),dt=(now-lastTick)/1000;lastTick=now;
  S.gold+=income()*dt;
  S.gemTimer+=dt;if(S.gemTimer>=30){S.gemTimer-=30;S.gems+=1}
  updateDyn();
},100);
setInterval(save,5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{offline();lastTick=performance.now()}});
window.addEventListener('pagehide',save);

function offline(){
  const sec=Math.min((Date.now()-S.last)/1000,OFFLINE_CAP);
  S.last=Date.now();
  if(sec<60)return;
  const earned=income()*sec;S.gold+=earned;const gems=Math.floor(sec/30);S.gems+=gems;
  modal(`<h2 style="text-align:center">♨️ Willkommen zurück!</h2><p style="text-align:center">Während du ${Math.floor(sec/3600)}h ${Math.floor(sec%3600/60)}min weg warst, haben deine Gäste gebadet:</p>
    <p style="text-align:center;font-size:22px"><b>+${fmt(earned)} 💰</b><br><b>+${gems} 💎</b></p><button class="btn" style="width:100%" data-close>Einsammeln</button>`);
}

offline();
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
