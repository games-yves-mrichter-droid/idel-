<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1d14">
<title>Onsen Idle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#1b120c;--panel:#33241a;--panel2:#46321f;--line:#6e4f30;
  --text:#fbf1e0;--muted:#cdb79a;--accent:#d9893a;--accent2:#ffd36f;
  --good:#5fd38d;--gem:#6fd3ff;--ticket:#ffd36f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:linear-gradient(#3a281a,#2a1d14ee);padding:8px 12px;border-bottom:1px solid var(--line)}
.res{display:flex;gap:8px;justify-content:space-between}
.res div{flex:1;background:var(--panel);border-radius:10px;padding:5px 8px;text-align:center;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.inc{text-align:center;color:var(--muted);font-size:12px;margin-top:4px}
main{flex:1;padding:12px 12px 90px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;justify-content:center;background:linear-gradient(#3a281a,#24180f);border-top:2px solid #8a6638;padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:flex;max-width:560px;width:100%}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:10px 0 8px;font-size:12px;cursor:pointer}
nav button b{display:block;font-size:22px}
nav button.on{color:var(--accent)}
h2{margin:6px 0 10px;font-size:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:12px}
button.btn{background:linear-gradient(#f0b060,#c8742c);color:#fff;text-shadow:0 1px 2px #0008;border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:13px;min-width:92px}
button.btn.alt{background:var(--panel2);border:1px solid var(--line)}
button.btn.gold{background:linear-gradient(#ffb347,#e8892a)}
button.btn.gem{background:linear-gradient(#5ac8f5,#2e8ec4)}
button.btn:disabled{opacity:.4;cursor:default}
.scene{position:relative;border-radius:16px;overflow:hidden;height:300px;background:linear-gradient(#3a2a5a,#6a3a6a 55%,#2e6f80 56%,#3b8a9a);margin-bottom:10px;border:1px solid var(--line)}
.scene svg.girl{position:absolute;left:50%;bottom:-6px;height:290px;transform:translateX(-50%)}
.steam{position:absolute;border-radius:50%;background:#fff;filter:blur(14px);opacity:.18;animation:steam 7s ease-in-out infinite}
@keyframes steam{0%{transform:translateY(20px) scale(.8);opacity:0}40%{opacity:.25}100%{transform:translateY(-140px) scale(1.4);opacity:0}}
.tapbtn{position:absolute;right:10px;bottom:10px;z-index:2}
.float{position:fixed;pointer-events:none;font-weight:800;color:var(--accent2);text-shadow:0 1px 3px #000;animation:fl 1s ease-out forwards;z-index:50}
@keyframes fl{to{transform:translateY(-60px);opacity:0}}
.avatar{width:52px;height:52px;border-radius:12px;background:var(--panel2);overflow:hidden;flex:none;border:1px solid var(--line)}
.avatar svg{width:100%;height:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gcard{background:var(--panel);border:2px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;position:relative}
.gcard svg{display:block;width:100%;height:220px;background:linear-gradient(#4a2a5a,#7a3f6e)}
.gcard .info{padding:6px 8px}
.gcard.locked svg{filter:brightness(0) opacity(.5)}
.rar{display:inline-block;font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;color:#000}
.rar.R{background:#9fd3a8}.rar.SR{background:#7fc3ff}.rar.SSR{background:#ffcf5a}.rar.UR{background:linear-gradient(90deg,#ff7ab6,#b28bff,#6fe1ff)}.rar.LR{background:linear-gradient(90deg,#ff5a3c,#ffd36f)}
.stars{color:var(--ticket);font-size:12px}
.modal{position:fixed;inset:0;background:#000b;z-index:40;display:flex;align-items:center;justify-content:center;padding:14px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:14px}
.big{display:block;width:100%;height:420px;border-radius:14px;background:linear-gradient(#3a2a5a,#6a3a6a 60%,#2e6f80 61%,#3b8a9a)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{flex:1;min-width:70px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 4px;font-size:12px;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent)}
.tabs button:disabled{opacity:.45}
.seg{display:flex;gap:4px;margin-bottom:10px}
.seg button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--accent)}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px;width:100%}
.bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.switch{display:flex;align-items:center;justify-content:space-between}
.glow{animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 10px var(--accent)}to{box-shadow:0 0 30px var(--accent2)}}
.water{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(#7fe0e8aa,#1f6c80dd);border-top:2px solid #ffffff55;pointer-events:none}
.gcard.R{border-color:#7fbf8a}.gcard.SR{border-color:#5aa8f0}.gcard.SSR{border-color:#ffcf5a;box-shadow:0 0 10px #ffcf5a55}.gcard.UR{border-color:#ff7ab6;box-shadow:0 0 14px #b28bff88}
.gcard .info{background:linear-gradient(#00000000,#00000066)}
.gcard.LR{border-color:#ff5a3c;box-shadow:0 0 16px #ff5a3c88}
/* Beschwören */
.banner{border-radius:16px;overflow:hidden;margin-bottom:12px;border:2px solid #8a6638;background:var(--panel)}
.banner.lux{border-color:#ffcf5a;box-shadow:0 0 18px #ffcf5a55}
.bannerArt{position:relative;height:220px;display:flex;justify-content:flex-end}
.bannerArt svg{height:100%;width:55%}
.bannerTxt{position:absolute;left:0;top:0;bottom:0;width:58%;padding:12px;background:linear-gradient(90deg,#1b120ce6,#1b120c00)}
.bannerName{font:700 22px Georgia,serif;background:linear-gradient(#fff6d0,#e0a540);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
.rates{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.bannerBtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px}
.sumHead{text-align:center;font:800 22px Georgia,serif;margin-bottom:10px}
.sumHead.r3{color:#ff9ad0;text-shadow:0 0 12px #ff7ab6}.sumHead.r4{color:#ffd36f;text-shadow:0 0 14px #ff5a3c}
.sumGrid .gcard svg{height:170px}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3) rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
/* Charakterseite */
.cv{position:fixed;inset:0;z-index:30;overflow:hidden;background:#000}
.cvBg{position:absolute;inset:-12px;filter:blur(4px) brightness(.85)}
.cvIn{position:relative;max-width:560px;height:100%;margin:0 auto}
.cvFig{position:absolute;left:0;right:0;top:56px;bottom:150px;display:flex;justify-content:center;pointer-events:none}
.cvFig svg{height:100%;max-width:100%;filter:drop-shadow(0 6px 14px #0008)}
.cvTop{position:absolute;left:10px;right:70px;top:12px;display:flex;gap:12px;align-items:flex-start}
.cvBadge{flex:none;width:54px;height:54px;margin:8px 4px;transform:rotate(45deg);border:3px solid #ffe7a0;background:radial-gradient(#5a3a1a,#2a180a);box-shadow:0 0 12px #ffcf5a88;display:flex;align-items:center;justify-content:center}
.cvBadge span{transform:rotate(-45deg);font:900 21px Georgia,serif;background:linear-gradient(#fff6d0,#e0a540 60%,#a8641a);-webkit-background-clip:text;background-clip:text;color:transparent}
.cvBadge.LR{border-color:#ffb08a;box-shadow:0 0 16px #ff5a3c}.cvBadge.UR{border-color:#ffb3d6}.cvBadge.R{border-color:#b9e3c2}.cvBadge.SR{border-color:#a8d3ff}
.cvPlate{min-width:0}
.cvName{font:800 22px system-ui,sans-serif;text-shadow:0 2px 4px #000;padding:2px 30px 2px 8px;background:linear-gradient(90deg,#000a,#0000)}
.cvTitle{font-weight:700;font-size:14px;padding:2px 8px;margin-top:4px;background:linear-gradient(90deg,#0009,#0000);text-shadow:0 1px 3px #000}
.cvStars{margin-top:4px;font-size:24px;letter-spacing:1px}.cvStars i{font-style:normal;color:#8a8a8a;text-shadow:0 1px 2px #000}.cvStars i.on{color:#ff4040;text-shadow:0 0 4px #ff0000,0 1px 2px #000}
.cvItem{position:absolute;left:8px;top:132px;width:88px;height:88px;border-radius:50%;background:radial-gradient(#ffcf5a,#e07a1a 60%,#8a3a0a);box-shadow:0 0 18px #ff9a2a;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cvItem div{width:56px;height:56px;border-radius:6px;background:linear-gradient(#ffe48a,#d9a03a);border:2px solid #fff3c4;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px}
.cvItem small{font:800 11px system-ui;color:#fff;text-shadow:0 1px 2px #000}
.cvSide{position:absolute;right:10px;top:12px;display:flex;flex-direction:column;gap:10px}
.cvSide button,.cvArrow{width:46px;height:46px;border-radius:50%;border:2px solid #ffffff55;background:#2a2a2acc;color:#fff;font-size:20px;cursor:pointer;box-shadow:0 2px 6px #0008}
.cvArrow{position:absolute;top:42%;background:none;border:0;box-shadow:none;font-size:44px;text-shadow:0 2px 6px #000}
.cvArrow.l{left:4px}.cvArrow.r{right:4px}
.cvPop{position:absolute;left:12px;right:66px;top:240px;background:#1b120cee;border:2px solid #8a6638;border-radius:14px;padding:12px;z-index:3}
.cvPop p{margin:6px 0}
.cvPanel{position:absolute;left:0;right:0;bottom:68px;padding:40px 10px 8px;background:linear-gradient(#0000,#1b120cd0 18%,#1b120cf0)}
.cvRow{display:flex;gap:8px;align-items:flex-end}
.cvLvl{font:900 46px/1 Georgia,serif;background:linear-gradient(#fff6d0,#e0a540 55%,#a8641a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 2px #000)}
.cvLvl span{font-size:26px}
.cvPow{display:inline-block;margin:4px 0 8px;padding:3px 40px 3px 10px;background:linear-gradient(90deg,#3a2a1aee,#3a2a1a00);font:800 22px system-ui;color:#fff;text-shadow:0 1px 3px #000}
.cvSkills{display:flex;gap:6px}
.sk{position:relative;width:54px;height:54px;border:2px solid #d8d8c8;border-radius:4px;background:linear-gradient(135deg,#a8f07a,#2f9a3a 60%,#14581e);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer}
.sk.ult{background:linear-gradient(135deg,#ffa0c8,#e0305a 60%,#801030);border-color:#ffcf5a}
.sk b{position:absolute;right:3px;top:0;font-size:12px;color:#fff;text-shadow:0 1px 2px #000}
.sk em{position:absolute;bottom:-1px;left:0;right:0;text-align:center;font:800 9px system-ui;font-style:normal;color:#ffe;background:#c0304ad0}
.cvEqWrap{flex:none;width:150px}
.cvEq{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.eq{position:relative;height:64px;border-radius:4px;border:2px solid #555;background:linear-gradient(#5a5048,#2e2822);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;cursor:pointer}
.eq i{position:absolute;top:-7px;width:12px;height:12px;transform:rotate(45deg);background:#a070ff;border:1px solid #fff}
.eq small{font:700 10px system-ui;color:#fff;text-shadow:0 1px 2px #000}
.eq.t0 i{display:none}.eq.t0{opacity:.75}
.eq.t1{background:linear-gradient(#6ad07a,#2a7a3a)}.eq.t2{background:linear-gradient(#6ab0f0,#2a5aa0)}.eq.t3{background:linear-gradient(#b080f0,#5a2aa0)}.eq.t4{background:linear-gradient(#ff7060,#b0201a);border-color:#ffcf5a}
.eq.sel{outline:3px solid #ffd36f;outline-offset:1px}
.cvAll{width:100%;margin-top:6px;padding:7px;border-radius:14px;border:2px solid #ffd0e0;background:linear-gradient(#ff9ab8,#e0507a);color:#fff;font:800 14px system-ui;text-shadow:0 1px 2px #0008;cursor:pointer}
.cvStats{display:flex;justify-content:space-between;margin-top:10px;padding:7px 12px;border-radius:8px;background:#000a;font-weight:700;font-size:14px}
.cvInfo{text-align:center;color:#e8d8c0;font-size:12px;margin-top:6px;min-height:16px}
.cvCost{text-align:center;margin-top:6px;min-height:26px}
.cvCost span{display:inline-block;padding:3px 14px;border-radius:14px;background:#000a;font-weight:800}
.cvCost .ok{color:#6ff07a}.cvCost .no{color:#ff5a5a}
.cvBm{display:flex;justify-content:center;gap:6px;margin-top:6px}
.cvBm button{background:#000a;color:#fff;border:1px solid #8a6638;border-radius:8px;padding:3px 12px;font-weight:700;cursor:pointer}.cvBm button.on{background:#d9893a}
.cvBtn{display:block;margin:8px auto 0;min-width:220px;padding:10px 26px;border-radius:30px;border:3px solid #ffe2a8;background:linear-gradient(#e8a860,#b8742c);color:#fff;font:800 22px Georgia,serif;text-shadow:0 2px 3px #0008;box-shadow:0 4px 12px #000a;cursor:pointer}
.cvBtn:disabled{filter:grayscale(.6) brightness(.8);cursor:default}
.cvNav{position:absolute;left:0;right:0;bottom:0;height:68px;display:flex;background:linear-gradient(#5a4028,#2e1f12);border-top:2px solid #a07a48}
.cvNav button{flex:1;background:none;border:0;border-right:1px solid #0004;color:#f0e0c0;cursor:pointer;padding:4px 2px}
.cvNav button b{display:block;font-size:22px}.cvNav button small{display:block;font:700 10px system-ui;text-shadow:0 1px 2px #000}
.cvNav button.on{background:linear-gradient(#8a6438,#5a4028);color:#fff}
@media (max-height:720px){.cvLvl{font-size:36px}.sk{width:46px;height:46px}.eq{height:54px}.cvItem{display:none}}
</style>
</head>

function fmt(n){
  if(!isFinite(n))return '∞';
  if(n<1000)return n<10&&n%1?n.toFixed(1):Math.floor(n).toString();
  const u=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];let i=0;
  while(n>=1000&&i<u.length-1){n/=1000;i++}
  if(n>=1000)return n.toExponential(2);
  return n.toFixed(n<10?2:n<100?1:0)+u[i];
}
function geo(c,r,l,n){return c*Math.pow(r,l)*(Math.pow(r,n)-1)/(r-1)}
function maxAfford(c,r,l,money){const f=c*Math.pow(r,l);if(money<f)return 0;return Math.floor(Math.log(money*(r-1)/f+1)/Math.log(r))}

  const g=G(id),o=S.girls[id],r=RAR[g.rarity];
  const m=(1+0.08*(o.lvl-1))*(1+0.25*(o.stars-1))*(1+0.08*o.seal);
  const atk=r.atk*m*(1+0.06*o.eq[0]+0.03*o.eq[2]);
  const hp=r.atk*8*m*(1+0.06*o.eq[1]);
  const def=r.atk*0.04*m*(1+0.05*o.eq[1]);
  const spd=100+o.lvl*0.5+o.eq[3]*3+o.seal*2+r.m*10;
  return{atk,hp,def,spd,power:atk*2+hp*0.2+def*5+spd*3};

  let n;
  if(S.buyMode==='max')n=S.infinite?(cap?cap-l:100):Math.max(1,maxAfford(c,r,l,S.gold));

  return Math.max(0,n);
}

      <div class="muted" style="margin-top:6px">Highlight: <b>${G(b.feat).name}</b> <span class="rar ${G(b.feat).rarity}">${G(b.feat).rarity}</span></div></div></div>
    <div class="bannerBtns">
      <button class="btn" data-sm="${b.id}:1:tickets">1× · ${b.c1.tickets} 🎟️</button><button class="btn gem" data-sm="${b.id}:1:gems">1× · ${b.c1.gems} 💎</button>
      <button class="btn" data-sm="${b.id}:10:tickets">10× · ${b.c10.tickets} 🎟️</button><button class="btn gem" data-sm="${b.id}:10:gems">10× · ${b.c10.gems} 💎</button>
    </div></div>`).join('')+
  `<div class="card muted">Doppelte Mädchen geben 10 🧩 Splitter für den Sternenaufstieg (+25% auf alle Werte pro Stern).</div>`;
  main.querySelectorAll('[data-sm]').forEach(b=>b.onclick=()=>{const[id,n,w]=b.dataset.sm.split(':');doSummon(id,+n,w)});

function rollRarity(rates){
  let r=Math.random()*100;
  for(const k of ['LR','UR','SSR','SR','R']){if(r<rates[k])return k;r-=rates[k]}
  return rates.R?'R':'SR';
}
function doSummon(bid,n,cur){
  const b=BANNERS.find(x=>x.id===bid),cost=(n===1?b.c1:b.c10)[cur];
  if(!pay(cur,cost)){toast(cur==='tickets'?'Nicht genug Tickets!':'Nicht genug Juwelen!');return}
  const res=[];
  for(let i=0;i<n;i++){
    S.pity++;
    let rar=S.pity>=PITY_LR?'LR':rollRarity(b.rates);
    if(n===10&&i===9&&RAR_ORDER.indexOf(rar)<2&&!res.some(r=>RAR_ORDER.indexOf(r.g.rarity)>=2))rar='SSR';
    if(rar==='LR')S.pity=0;
    const pool=GIRLS.filter(g=>g.rarity===rar),g=pool[Math.floor(Math.random()*pool.length)];
    let note;
    if(!S.girls[g.id]){S.girls[g.id]=newGirl();note='NEU!'}
    else{S.girls[g.id].shards+=10;note='+10 🧩'}
    res.push({g,note});
  }
  save();updateDyn();renderSummon();
  const best=res.reduce((a,r)=>Math.max(a,RAR_ORDER.indexOf(r.g.rarity)),0);
  modal(`<div class="sumHead r${best}">${best>=4?'✨ LEGENDÄR! ✨':best>=3?'🌟 ULTRA-SELTEN! 🌟':'Beschwörung!'}</div>
    <div class="grid sumGrid">${res.map((r,i)=>`<div class="gcard ${r.g.rarity} pop" style="animation-delay:${i*.12}s">${girlSVG(r.g,stageFor(S.girls[r.g.id].lvl))}<div class="info"><span class="rar ${r.g.rarity}">${r.g.rarity}</span> <b>${r.g.name}</b><div class="muted">${r.note}</div></div></div>`).join('')}</div>
    <button class="btn" style="width:100%;margin-top:12px" data-close>OK</button>`);
}

function cvAction(){
  const g=G(CV.id),o=S.girls[CV.id];
  if(CV.tab==='lvl'){
    if(o.lvl>=GIRL_MAX)return{label:'MAX',res:'💰',have:S.gold,need:0,can:false,info:'Maximale Stufe erreicht – alle Outfits freigeschaltet.'};
    const f=girlOffer(g),st=stageFor(o.lvl),next=STAGES[st+1];
    return{label:`Verbessern ×${f.n}`,res:'💰',have:S.gold,need:f.cost,can:f.n>0&&canPay('gold',f.cost),
      info:next?`Nächstes Outfit „${next.name}“ ab Stufe ${next.lvl} · alle 10 Stufen +5 💎`:'Alle Outfits freigeschaltet',
      fn:()=>{if(!pay('gold',f.cost))return;const before=stageFor(o.lvl),tens=Math.floor(o.lvl/10);o.lvl+=f.n;S.gems+=5*(Math.floor(o.lvl/10)-tens);
        if(stageFor(o.lvl)>before){CV.view=stageFor(o.lvl);toast(`Neues Outfit: ${STAGES[CV.view].name}!`)}}};
  }
  if(CV.tab==='star'){
    const need=o.stars*10;
    if(o.stars>=5)return{label:'MAX',res:'🧩',have:o.shards,need:0,can:false,info:'5 Sterne erreicht.'};
    return{label:'Sternenaufstieg',res:'🧩',have:o.shards,need,can:S.infinite||o.shards>=need,info:'+25% auf alle Werte pro Stern · Splitter bekommst du durch doppelte Beschwörungen',
      fn:()=>{if(!S.infinite)o.shards-=need;o.stars++;toast(`${g.name} hat jetzt ${o.stars} ★!`)}};
  }
  if(CV.tab==='seal'){
    const need=50*(o.seal+1);
    if(o.seal>=SEAL_MAX)return{label:'MAX',res:'💎',have:S.gems,need:0,can:false,info:`Siegel ${SEAL_MAX}/${SEAL_MAX} – voll erweckt.`};
    return{label:'Siegel stärken',res:'💎',have:S.gems,need,can:canPay('gems',need),info:`Siegel ${o.seal}/${SEAL_MAX} · jede Stufe +8% auf alle Werte und +2 Tempo`,
      fn:()=>{if(pay('gems',need))o.seal++}};

  const i=CV.slot,need=eqCost(o,i),e=EQUIP[i];
  if(o.eq[i]>=EQ_MAX)return{label:'MAX',res:'💰',have:S.gold,need:0,can:false,info:`${e.n} ist voll verbessert.`};
  return{label:`${e.n} ${o.eq[i]?'verbessern':'anlegen'}`,res:'💰',have:S.gold,need,can:canPay('gold',need),
    info:`${e.i} ${e.n} Stufe ${o.eq[i]}/${EQ_MAX} · tippe auf einen Ausrüstungsplatz, um ihn auszuwählen`,
    fn:()=>{if(pay('gold',need))o.eq[i]++}};

  R.querySelector('#cvBack').onclick=R.querySelector('#cvClose').onclick=closeCV;
  R.querySelector('#cvFav').onclick=()=>{S.favorite=CV.id;re()};
  R.querySelectorAll('[data-cvtab]').forEach(b=>b.onclick=()=>{CV.tab=b.dataset.cvtab;renderCV()});
  R.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{CV.tab='eq';CV.slot=+b.dataset.slot;renderCV()});
  R.querySelectorAll('[data-pop]').forEach(b=>b.onclick=()=>{CV.pop=CV.pop===b.dataset.pop?null:b.dataset.pop;renderCV()});
  R.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{CV.view=+b.dataset.st;renderCV()});
  R.querySelectorAll('[data-bm]').forEach(b=>b.onclick=()=>{const v=b.dataset.bm;S.buyMode=v==='max'?'max':+v;renderCV()});
  R.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{const s=SKILLS[+b.dataset.sk];CV.pop=null;floatText({clientX:innerWidth/2-80,clientY:innerHeight/2},`${s.i} ${s.n}: ${s.d}`)});
  R.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
    const ids=GIRLS.filter(x=>S.girls[x.id]).map(x=>x.id),i=(ids.indexOf(CV.id)+ +b.dataset.nav+ids.length)%ids.length;
    CV.id=ids[i];CV.view=stageFor(S.girls[CV.id].lvl);CV.pop=null;renderCV()});
  R.querySelector('#eqAll').onclick=()=>{let n=0;EQUIP.forEach((e,i)=>{if(o.eq[i]<EQ_MAX&&pay('gold',eqCost(o,i))){o.eq[i]++;n++}});CV.tab='eq';if(!n)toast('Nicht genug Gold!');re()};
  const asg=R.querySelector('#asg');
  if(asg)asg.onchange=e=>{for(const k in S.assign)if(S.assign[k]===CV.id)delete S.assign[k];if(e.target.value)S.assign[e.target.value]=CV.id;re()};
}
function cvRefresh(){
  if(!CV)return;const a=cvAction(),el=$('#cvCost'),btn=$('#cvAct');if(!el)return;
  el.innerHTML=a.need?`<span class="${a.can?'ok':'no'}">${a.res} ${S.infinite?'∞':fmt(a.have)}/${fmt(a.need)}</span>`:'';
  btn.disabled=!a.can;
}

function renderFree(){
  main.innerHTML=`<h2>🎁 Gratis-Ressourcen</h2>
  <div class="card switch"><div><b>♾️ Unendliche Ressourcen</b><div class="muted">Alles kostet nichts mehr.</div></div>
    <button class="btn ${S.infinite?'':'alt'}" id="inf">${S.infinite?'AN':'AUS'}</button></div>
  <div class="card"><b>💰 Gold</b><div class="row" style="margin-top:8px;flex-wrap:wrap">
    <button class="btn gold" data-add="gold:1e6">+1 Mio</button><button class="btn gold" data-add="gold:1e9">+1 Mrd</button><button class="btn gold" data-add="gold:1e15">+1 Qa</button><button class="btn gold" data-mul="gold:10">×10</button></div></div>
  <div class="card"><b>💎 Juwelen</b><div class="row" style="margin-top:8px;flex-wrap:wrap">
    <button class="btn gem" data-add="gems:1000">+1.000</button><button class="btn gem" data-add="gems:100000">+100.000</button></div></div>
  <div class="card"><b>🎟️ Tickets</b><div class="row" style="margin-top:8px;flex-wrap:wrap">
    <button class="btn" data-add="tickets:10">+10</button><button class="btn" data-add="tickets:100">+100</button><button class="btn" data-add="tickets:1000">+1.000</button></div></div>
  <div class="card"><b>⚡ Abkürzungen</b><div class="row" style="margin-top:8px;flex-wrap:wrap">
    <button class="btn" id="allGirls">Alle Mädchen freischalten</button>
    <button class="btn" id="maxGirls">Alle Mädchen Max-Level</button>
    <button class="btn" id="maxBaths">Alle Bäder +100 Level</button>
    <button class="btn" id="autoAssign">Gastgeberinnen auto-zuweisen</button></div></div>
  <div class="card"><b>⚙️ Spielstand</b><div class="muted">Wird automatisch lokal auf deinem Gerät gespeichert – komplett offline.</div>
    <div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn alt" id="exp">Exportieren</button><button class="btn alt" id="imp">Importieren</button><button class="btn" style="background:#b03a4a" id="reset">Zurücksetzen</button></div></div>`;
  $('#inf').onclick=()=>{S.infinite=!S.infinite;save();render()};
  main.querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{const[k,v]=b.dataset.add.split(':');S[k]+=+v;floatText(e,'+'+fmt(+v));save();updateDyn()});
  main.querySelectorAll('[data-mul]').forEach(b=>b.onclick=e=>{const[k,v]=b.dataset.mul.split(':');S[k]=Math.max(1,S[k])*+v;floatText(e,'×'+v);save();updateDyn()});
  $('#allGirls').onclick=()=>{GIRLS.forEach(g=>{if(!S.girls[g.id])S.girls[g.id]=newGirl()});toast('Alle Mädchen freigeschaltet!')};
  $('#maxGirls').onclick=()=>{Object.values(S.girls).forEach(o=>{o.lvl=GIRL_MAX;o.stars=5;o.seal=SEAL_MAX;o.eq=[EQ_MAX,EQ_MAX,EQ_MAX,EQ_MAX]});toast('Alle Mädchen komplett maximiert!')};
  $('#maxBaths').onclick=()=>{BATHS.forEach(b=>S.baths[b.id]=(S.baths[b.id]||0)+100);toast('Alle Bäder +100 Level!')};
  $('#autoAssign').onclick=()=>{autoAssign();toast('Gastgeberinnen zugewiesen!')};
  $('#exp').onclick=()=>{save();modal(`<h2>Export</h2><textarea style="width:100%;height:140px" readonly>${btoa(unescape(encodeURIComponent(JSON.stringify(S))))}</textarea><button class="btn" style="width:100%;margin-top:8px" data-close>Schließen</button>`)};
  $('#imp').onclick=()=>{const t=prompt('Spielstand-Code einfügen:');if(!t)return;try{S=Object.assign(fresh(),JSON.parse(decodeURIComponent(escape(atob(t.trim())))));normalize();save();toast('Importiert!')}catch(e){alert('Ungültiger Code')}};
  $('#reset').onclick=()=>{if(confirm('Wirklich alles zurücksetzen?')){S=fresh();closeCV();save();render()}};
}
function autoAssign(){
  const ranked=Object.keys(S.girls).sort((a,b)=>hostPower(b)-hostPower(a));
  const baths=BATHS.filter(b=>S.baths[b.id]).sort((a,b)=>b.base-a.base);
  S.assign={};baths.forEach((b,i)=>{if(ranked[i])S.assign[b.id]=ranked[i]});save();
}
function hostPower(id){return stats(id).power}

function modal(html){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="modal"><div class="box">${html}</div></div>`;
  const m=root.firstChild;
  m.onclick=e=>{if(e.target===m||e.target.closest('[data-close]')){root.innerHTML='';render()}};
}
function toast(t){const d=document.createElement('div');d.className='float';d.style.left='50%';d.style.top='45%';d.style.transform='translateX(-50%)';d.style.fontSize='20px';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000);save();render()}
function floatText(e,t){const d=document.createElement('div');d.className='float';d.style.left=(e.clientX-20)+'px';d.style.top=(e.clientY-20)+'px';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}

function updateDyn(){
  $('#rGold').textContent=S.infinite?'∞':fmt(S.gold);
  $('#rGems').textContent=S.infinite?'∞':fmt(S.gems);
  $('#rTix').textContent=S.infinite?'∞':fmt(S.tickets);
  $('#rInc').textContent=`+${fmt(income())} Gold/Sek · Sammelbonus ×${collectionBonus().toFixed(1)}`;
  main.querySelectorAll('[data-bath]').forEach(btn=>{
    const b=B(btn.dataset.bath),o=bathOffer(b),l=S.baths[b.id]||0;
    btn.innerHTML=`${l?'+'+o.n+' Lv':'Bauen'}<br>${fmt(o.cost)} 💰`;
    btn.disabled=o.n<1||!canPay('gold',o.cost);
  });
  main.querySelectorAll('[data-binc]').forEach(el=>{const b=B(el.dataset.binc);const l=S.baths[b.id]||0;el.textContent=l?`${fmt(bathIncome(b)*collectionBonus())} Gold/Sek · nächster ×2 bei Lv ${(Math.floor(l/25)+1)*25}`:`Noch nicht gebaut`});
}

/* ================= Spielschleife ================= */
let lastTick=performance.now(),cvTick=0;
setInterval(()=>{
  const now=performance.now(),dt=(now-lastTick)/1000;lastTick=now;
  S.gold+=income()*dt;
  S.gemTimer+=dt;if(S.gemTimer>=30){S.gemTimer-=30;S.gems+=1}
  updateDyn();
  if(CV&&(++cvTick%5===0))cvRefresh();
},100);
setInterval(save,5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{offline();lastTick=performance.now()}});
window.addEventListener('pagehide',save);

function offline(){
  const sec=Math.min((Date.now()-S.last)/1000,OFFLINE_CAP);
  S.last=Date.now();
  if(sec<60)return;
  const earned=income()*sec;S.gold+=earned;const gems=Math.floor(sec/30);S.gems+=gems;
  modal(`<h2 style="text-align:center">♨️ Willkommen zurück!</h2><p style="text-align:center">Während du ${Math.floor(sec/3600)}h ${Math.floor(sec%3600/60)}min weg warst, haben deine Gäste gebadet:</p>
    <p style="text-align:center;font-size:22px"><b>+${fmt(earned)} 💰</b><br><b>+${gems} 💎</b></p><button class="btn" style="width:100%" data-close>Einsammeln</button>`);
}

offline();
render();
// Android-Zurück-Taste: erst Fenster schließen, dann App verlassen
function onAndroidBack(){
  if($('#modalRoot').innerHTML){$('#modalRoot').innerHTML='';render();return true}
  if(CV){if(CV.pop){CV.pop=null;renderCV()}else closeCV();return true}
  if(tab!=='onsen'){document.querySelector('nav button[data-tab=onsen]').click();return true}
  return false;
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&!navigator.userAgent.includes('OnsenIdleApp'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
