<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sternenkrone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: eine Märchenbühne in voller Höhe; Bildschirme wechseln in einer 520px-Spalte */
  --night:#1a1430; --dusk:#2b2150; --plum:#4a3478; --plum2:#5d4392;
  --gold:#ffd166; --gold-d:#d9962b; --rose:#ff8db4; --ink:#fff8ee; --mute:#c8bce6;
  --hp:#5ee08a; --hp-mid:#ffd34d; --hp-low:#ff5d6c; --panel:rgba(30,22,58,.82); --line:rgba(255,255,255,.14);
  --f-display:"Cinzel Decorative","Palatino Linotype",Georgia,serif;
  --f-ui:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,#3d2c72 0%,var(--night) 60%)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sky{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 30% 8%,#fff,transparent),radial-gradient(2px 2px at 72% 14%,#ffe9a8,transparent),radial-gradient(1px 1px at 86% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 52% 26%,#fff,transparent),radial-gradient(1px 1px at 8% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 92% 6%,#fff,transparent);animation:twinkle 5s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.55}to{opacity:1}}

/* ---------- Buttons ---------- */
.btn{border:0;border-radius:999px;padding:14px 22px;font-size:18px;font-weight:600;letter-spacing:.02em;background:linear-gradient(180deg,#ffe08a,var(--gold) 45%,var(--gold-d));color:#4a2a00;box-shadow:0 5px 0 #a8681a,0 10px 24px rgba(0,0,0,.35);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a8681a,0 6px 14px rgba(0,0,0,.35)}
.btn.soft{background:linear-gradient(180deg,#7b62c0,var(--plum2) 50%,var(--plum));color:var(--ink);box-shadow:0 5px 0 #2e1f55,0 10px 24px rgba(0,0,0,.35)}
.btn.soft:active{box-shadow:0 2px 0 #2e1f55}
.btn.small{padding:9px 16px;font-size:15px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:20px;font-weight:700;display:grid;place-items:center;flex:none}

/* ---------- Home ---------- */
#s-home{align-items:stretch}
.home-head{text-align:center;padding-top:28px;position:relative}
.home-head h1{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,10vw,48px);margin:0;line-height:1.05;color:var(--gold);text-shadow:0 2px 0 #8a4f10,0 0 24px rgba(255,209,102,.45);text-wrap:balance}
.home-head p{margin:8px auto 0;max-width:30ch;color:var(--mute);font-size:15px;line-height:1.4;text-wrap:balance}
.showcase{position:relative;flex:1;min-height:250px;display:flex;align-items:flex-end;justify-content:center}
.showcase .sprite{position:relative;width:min(62%,38vh);aspect-ratio:200/260;cursor:pointer}
.hero-info{text-align:center;position:relative;padding-block:6px 0}
.hero-info .name{font-size:24px;font-weight:700}
.hero-info .title{color:var(--mute);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;color:#1b1030;letter-spacing:.03em;vertical-align:middle}
.chip svg{width:13px;height:13px}
.xpbar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;max-width:240px;margin:8px auto 0}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#9be7ff,#c9a6ff);border-radius:99px;transition:width .6s}
.menu{display:flex;flex-direction:column;gap:14px;padding-block:18px calc(22px + env(safe-area-inset-bottom,0px));position:relative}
.menu .row{display:flex;gap:12px}
.menu .row .btn{flex:1}

/* ---------- Topbar / Lists ---------- */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding-block:14px;background:linear-gradient(var(--night) 70%,transparent)}
.topbar h2{margin:0;font-size:22px;flex:1}
.topbar .total{font-weight:600;color:var(--gold)}
.chapter{margin:10px 0 6px}
.chapter h3{margin:0;font-family:var(--f-display);font-size:19px;color:var(--gold)}
.chapter p{margin:2px 0 0;color:var(--mute);font-size:13px}
.stages{display:flex;flex-direction:column;gap:10px;position:relative;padding-left:10px;margin-bottom:18px}
.stages::before{content:"";position:absolute;left:37px;top:20px;bottom:20px;width:4px;border-radius:2px;background:repeating-linear-gradient(var(--plum2) 0 8px,transparent 8px 14px)}
.stage{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:8px 12px 8px 8px}
.stage:disabled{opacity:.45;cursor:default}
.stage .faces{display:flex;flex:none}
.face{width:56px;height:56px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 40% 35%,#6b55a8,#2a1f4c);border:3px solid var(--plum2);flex:none}
.face+.face{margin-left:-22px}
.face svg{width:100%;height:100%;display:block}
.stage.boss .face{border-color:var(--gold)}
.stage .txt{flex:1;min-width:0}
.stage .txt b{display:block;font-size:16px}
.stage .txt span{color:var(--mute);font-size:13px}
.stars{color:var(--gold);font-size:18px;letter-spacing:1px;white-space:nowrap}
.stars .off{color:rgba(255,255,255,.2)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-bottom:24px}
.pcard{position:relative;border:2px solid var(--line);background:var(--panel);border-radius:20px;padding:8px 8px 12px;text-align:center}
.pcard.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,209,102,.25),0 0 24px rgba(255,209,102,.25)}
.pcard .pic{height:150px;display:flex;justify-content:center;align-items:flex-end;border-radius:14px;background:radial-gradient(circle at 50% 70%,rgba(255,255,255,.14),transparent 65%)}
.pcard .pic svg{height:100%}
.pcard.locked .pic svg{filter:brightness(0) opacity(.55)}
.pcard b{display:block;font-size:17px;margin-top:4px}
.pcard small{display:block;color:var(--mute);font-size:12px;line-height:1.35}
.pcard .lv{position:absolute;top:8px;left:10px;font-weight:700;font-size:13px;background:rgba(0,0,0,.35);border-radius:99px;padding:1px 8px}
.pcard .moves{margin-top:6px;font-size:12px;color:var(--ink);opacity:.85}

/* ---------- Battle ---------- */
#s-battle{overflow:hidden}
#arena{position:relative;flex:1;overflow:hidden;touch-action:none;cursor:pointer}
#arenaBg{position:absolute;inset:0}
#arenaBg svg{width:100%;height:100%;display:block}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.sprite{position:absolute;aspect-ratio:200/260}
.sprite .act,.sprite .idle{position:absolute;inset:0}
.sprite svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.plat{position:absolute;left:-6%;right:-6%;bottom:-9%;height:22%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.34),rgba(255,255,255,.12) 62%,rgba(255,255,255,.04) 80%,transparent);border:3px solid rgba(255,255,255,.28);box-shadow:0 0 22px var(--pc,rgba(255,255,255,.2)),inset 0 0 18px var(--pc,rgba(255,255,255,.2))}
.shadow{position:absolute;left:22%;right:22%;bottom:-3%;height:9%;border-radius:50%;background:radial-gradient(closest-side,rgba(10,0,20,.55),transparent);animation:shad 2.6s ease-in-out infinite}
.idle{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 96%}
.e-side .idle{animation-duration:2.1s}
.e-side .shadow{animation-duration:2.1s}
.floaty .idle{animation:float 3s ease-in-out infinite}
.floaty .shadow{animation:shadf 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-1.5%) scale(1.025,.975)}}
@keyframes shad{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.06)}}
@keyframes float{0%,100%{transform:translateY(-3%)}50%{transform:translateY(-9%)}}
@keyframes shadf{0%,100%{transform:scale(.85);opacity:.8}50%{transform:scale(.7);opacity:.55}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.4s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
#hSprite{left:3%;bottom:5%;width:min(44%,30vh);z-index:3}
#eSprite{right:5%;top:16%;width:min(42%,28vh);z-index:2}
.e-side.big{width:min(50%,33vh)!important}
.tele .act{animation:tele .35s ease-in-out infinite alternate}
@keyframes tele{from{filter:drop-shadow(0 0 4px #ffef7a) brightness(1)}to{filter:drop-shadow(0 0 22px #ff4d4d) brightness(1.3)}}
.warn{position:absolute;left:50%;top:-6%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff58a,#ffb020);color:#5a1d00;font-weight:700;font-size:30px;display:grid;place-items:center;box-shadow:0 0 18px #ffcf40;animation:warn .3s ease-in-out infinite alternate;z-index:5}
@keyframes warn{from{transform:translateX(-50%) scale(.9)}to{transform:translateX(-50%) scale(1.15)}}
.glowing .act{filter:drop-shadow(0 0 14px var(--ec,#fff)) drop-shadow(0 0 4px #fff)}

.hud{position:absolute;z-index:6;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hud .nm{display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden}
.hud .nm .lvl{color:var(--mute);font-weight:500;font-size:13px}
.hud .hpw{position:relative;height:10px;border-radius:99px;background:rgba(0,0,0,.45);overflow:hidden;margin-top:6px}
.hud .hpw i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.hud .hpw .lag{background:#fff;opacity:.75;transition:width .7s .25s}
.hud .hpw .bar{background:var(--hp);transition:width .2s,background .3s}
.hud .num{font-size:12px;color:var(--mute);margin-top:3px;font-variant-numeric:tabular-nums}
#eHud{top:calc(10px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:76px}
#hHud{right:max(16px,env(safe-area-inset-right,0px));bottom:14px;width:min(48%,230px)}
#pauseBtn{position:absolute;z-index:7;top:calc(10px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:48px;height:48px}
#wave{position:absolute;z-index:6;top:calc(84px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));font-size:12px;color:var(--mute);pointer-events:none}

#pops{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-weight:700;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 8px rgba(0,0,0,.5)}
.pop.dmg{font-size:30px;color:#fff;-webkit-text-stroke:1.5px #6a2a8a}
.pop.dmg.crit{font-size:40px;color:#fff5a8;-webkit-text-stroke:2px #b8460f}
.pop.msg{font-size:18px;color:var(--gold)}
.pop.weak{color:#c9c2dd}
.pop.heal{color:#9bffb5}
#banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:9}
#banner div{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,9vw,44px);color:var(--gold);text-align:center;padding:0 16px;text-shadow:0 3px 0 #7a3f0a,0 0 30px rgba(255,200,80,.6);text-wrap:balance}
#banner small{display:block;font-family:var(--f-ui);font-weight:500;font-size:16px;color:var(--ink);text-shadow:0 2px 6px #000;margin-top:4px}
#dim{position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,rgba(20,8,40,.25),rgba(10,4,24,.75));opacity:0;transition:opacity .3s;pointer-events:none;z-index:2}
#dim.on{opacity:1}
.tapstar{position:absolute;z-index:10;width:64px;height:64px;margin:-32px 0 0 -32px;border:0;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0 14%,var(--sc,#ffd84d) 30%,transparent 68%);animation:tapin .9s ease-out forwards;touch-action:none}
.tapstar::after{content:"";position:absolute;inset:6px;border-radius:50%;border:3px solid var(--sc,#ffd84d);animation:tapring .9s linear forwards}
@keyframes tapin{0%{transform:scale(0) rotate(0)}20%{transform:scale(1.15) rotate(40deg)}80%{opacity:1}100%{transform:scale(.8) rotate(120deg);opacity:0}}
@keyframes tapring{from{transform:scale(1.6);opacity:.9}to{transform:scale(.5);opacity:.2}}
#chargeHint{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:9;pointer-events:none;font-size:20px;font-weight:700;color:#fff;text-shadow:0 2px 8px #000}

.controls{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(26,20,48,.0),var(--night) 30%);position:relative;z-index:6}
.dodge{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600;line-height:1.1;flex:none}
.dodge span{display:block;font-size:22px;line-height:1}
.charged{display:flex;gap:18px;justify-content:center;flex:1}
.cbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;width:84px}
.cbtn .ring{position:relative;width:68px;height:68px;border-radius:50%;overflow:hidden;background:rgba(0,0,0,.4);border:3px solid rgba(255,255,255,.25)}
.cbtn .fill{position:absolute;left:0;right:0;bottom:0;height:0%;background:var(--ec);opacity:.55;transition:height .25s}
.cbtn .ring svg{position:absolute;inset:0;margin:auto;width:32px;height:32px;color:#fff;opacity:.6}
.cbtn .lbl{font-size:12px;font-weight:600;line-height:1.15;text-align:center;color:var(--mute)}
.cbtn .cost{font-size:11px;color:var(--mute);opacity:.8}
.cbtn.ready .ring{border-color:#fff;box-shadow:0 0 18px var(--ec),0 0 4px #fff;animation:ready .7s ease-in-out infinite alternate}
.cbtn.ready .fill{opacity:.9}
.cbtn.ready .ring svg{opacity:1}
.cbtn.ready .lbl{color:#fff}
@keyframes ready{from{transform:scale(1)}to{transform:scale(1.08)}}
.hint{text-align:center;font-size:12px;color:var(--mute);position:relative;z-index:6;padding-bottom:2px}

/* ---------- Modal ---------- */
.modal{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(8,4,20,.7);padding:16px}
.modal .box{width:100%;max-width:400px;background:linear-gradient(180deg,#3b2a6c,#251a48);border:2px solid rgba(255,209,102,.4);border-radius:26px;padding:22px 18px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:boxin .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes boxin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-family:var(--f-display);font-size:30px;margin:0;color:var(--gold);text-wrap:balance}
.modal p{color:var(--mute);margin:8px 0;line-height:1.4}
.modal .bigstars{font-size:46px;letter-spacing:6px;margin:8px 0}
.modal .bigstars span{display:inline-block;animation:starpop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
.modal .actions{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.modal .pic{height:150px;display:flex;justify-content:center}
.modal .pic svg{height:100%}
.toast{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:10px 18px;font-weight:600;white-space:nowrap;animation:toast 2s ease forwards;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.idle,.shadow,.sky,.blink{animation:none!important}}
</style>

<div id="app">
  <!-- Home -->
  <section id="s-home" class="screen">
    <div class="sky"></div>
    <header class="home-head pad">
      <h1>Sternenkrone</h1>
      <p>Rette das Märchenreich vor Hexen, Trollen und dem Schattenkönig.</p>
    </header>
    <div class="showcase"><div class="sprite" id="homeHero" title="Antippen"></div></div>
    <div class="hero-info pad" id="homeInfo"></div>
    <div class="menu pad">
      <button class="btn" id="goMap">Abenteuer starten</button>
      <div class="row">
        <button class="btn soft small" id="goTeam">Prinzessinnen</button>
        <button class="btn soft small" id="sndBtn">Ton: an</button>
      </div>
    </div>
  </section>

  <!-- Map -->
  <section id="s-map" class="screen" hidden>
    <div class="topbar pad"><button class="iconbtn" data-back aria-label="Zurück">‹</button><h2>Märchenreise</h2><span class="total" id="starTotal"></span></div>
    <div class="pad" id="mapList"></div>
  </section>

  <!-- Team -->
  <section id="s-team" class="screen" hidden>
    <div class="topbar pad"><button class="iconbtn" data-back aria-label="Zurück">‹</button><h2>Prinzessinnen</h2></div>
    <div class="pad grid" id="teamGrid"></div>
  </section>

  <!-- Battle -->
  <section id="s-battle" class="screen" hidden>
    <div id="arena">
      <div id="arenaBg"></div>
      <div id="dim"></div>
      <div class="sprite e-side" id="eSprite"><div class="plat"></div><div class="shadow"></div><div class="act"><div class="idle"></div></div></div>
      <div class="sprite h-side" id="hSprite"><div class="plat"></div><div class="shadow"></div><div class="act"><div class="idle"></div></div></div>
      <canvas id="fx"></canvas>
      <div id="pops"></div>
      <div class="hud" id="eHud"><div class="nm"><span id="eName"></span><span class="lvl" id="eLvl"></span><span id="eChip"></span></div><div class="hpw"><i class="lag" id="eLag"></i><i class="bar" id="eBar"></i></div></div>
      <div id="wave"></div>
      <div class="hud" id="hHud"><div class="nm"><span id="hName"></span><span class="lvl" id="hLvl"></span></div><div class="hpw"><i class="lag" id="hLag"></i><i class="bar" id="hBar"></i></div><div class="num" id="hNum"></div></div>
      <button class="iconbtn" id="pauseBtn" aria-label="Pause">II</button>
      <div id="chargeHint" hidden>Tippe die Sterne!</div>
      <div id="banner"></div>
    </div>
    <div class="hint" id="hint">Tippen = Angriff · Wischen = Ausweichen</div>
    <div class="controls pad">
      <button class="dodge" id="dodgeL" aria-label="Nach links ausweichen"><span>«</span>Weichen</button>
      <div class="charged" id="charged"></div>
      <button class="dodge" id="dodgeR" aria-label="Nach rechts ausweichen"><span>»</span>Weichen</button>
    </div>
  </section>

  <div id="modalRoot"></div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ================= DATEN ================= */
const ELEM={
  licht:{n:'Licht',c:'#ffd84d',c2:'#fff3b0',shape:'star'},
  wasser:{n:'Wasser',c:'#3fb6ff',c2:'#c4ecff',shape:'bubble'},
  natur:{n:'Natur',c:'#5fd068',c2:'#ffb3d1',shape:'leaf'},
  frost:{n:'Frost',c:'#9fe8ff',c2:'#ffffff',shape:'shard'},
  feuer:{n:'Feuer',c:'#ff7a2f',c2:'#ffd166',shape:'flame'},
  schatten:{n:'Schatten',c:'#a46bff',c2:'#3a1466',shape:'smoke'},
  stein:{n:'Stein',c:'#c39a66',c2:'#e8d4ad',shape:'rock'},
};
const STRONG={licht:['schatten'],wasser:['feuer','stein'],natur:['wasser','stein'],frost:['natur'],feuer:['frost','natur'],schatten:['licht'],stein:['feuer','frost']};
const WEAK={licht:['licht'],wasser:['natur','wasser'],natur:['feuer','natur'],frost:['feuer','wasser'],feuer:['wasser','stein','feuer'],schatten:['schatten'],stein:['natur']};

try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.p){save=Object.assign(freshSave(),s);PRINCESSES.forEach(x=>{if(!save.p[x.id])save.p[x.id]={lvl:1,xp:0}})}}catch(e){}

function tone(f,dur,type='sine',vol=.12,f2=null,delay=0){const a=ac();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur,vol=.15,freq=800,delay=0){const a=ac();if(!a)return;const t=a.currentTime+delay,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=NOISE;f.type='bandpass';f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+dur)}
const SFX={
  tap(){tone(880,.09,'triangle',.08,1320)},
  hit(){noise(.12,.18,500);tone(180,.12,'square',.05,90)},
  big(){noise(.5,.25,300);tone(120,.5,'sawtooth',.08,40)},
  charge(){tone(300,.7,'sawtooth',.05,1200)},
  star(){tone(1320,.12,'sine',.1,1980)},
  warn(){tone(700,.1,'square',.06);tone(700,.1,'square',.06,null,.16)},
  dodge(){noise(.18,.12,1800)},
  poof(){[880,1100,1320,1760].forEach((f,i)=>tone(f,.18,'triangle',.07,null,i*.06))},
  win(){[523,659,784,1046].forEach((f,i)=>tone(f,.3,'triangle',.1,null,i*.13))},
  lose(){[440,370,311,262].forEach((f,i)=>tone(f,.35,'sine',.1,null,i*.18))},
  click(){tone(660,.06,'triangle',.06)},

const cv=$('#fx'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1;
function resize(){const r=$('#arena').getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);CW=r.width;CH=r.height;cv.width=CW*DPR;cv.height=CH*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
window.addEventListener('resize',()=>{if(!$('#s-battle').hidden)resize()});
const parts=[],items=[];
const glowCache={};
function glowSprite(c){if(glowCache[c])return glowCache[c];const s=document.createElement('canvas');s.width=s.height=64;const g=s.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.22,c);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);return glowCache[c]=s}
function glow(x,y,r,c){ctx.drawImage(glowSprite(c),x-r,y-r,r*2,r*2)}
function spawn(o){if(parts.length>600)return;parts.push(Object.assign({x:0,y:0,vx:0,vy:0,g:0,life:1,max:1,size:4,color:'#fff',shape:'dot',rot:rnd(0,6.28),vr:rnd(-4,4),drag:0,add:true},o))}
function burst(x,y,el,n=16,sp=180,extra={}){const E=ELEM[el];for(let i=0;i<n;i++){const a=rnd(0,6.28),v=rnd(.3,1)*sp;const L=rnd(.4,.9);spawn(Object.assign({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:L,max:L,size:rnd(5,11),color:Math.random()<.5?E.c:E.c2,shape:E.shape,drag:2.5,g:E.shape==='rock'?500:E.shape==='flame'?-120:E.shape==='smoke'?-30:40,add:E.shape!=='smoke'&&E.shape!=='rock'},extra))}
  for(let i=0;i<n/2;i++){const a=rnd(0,6.28),v=rnd(.4,1)*sp*1.3;spawn({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.4,max:.4,size:rnd(4,8),color:E.c,shape:'dot',drag:3})}}
function ring(x,y,c,r1=80,dur=.45,w=6){items.push({type:'ring',x,y,c,r1,t:0,dur,w})}
function proj(x0,y0,x1,y1,el,dur,size,arc,onHit){items.push({type:'proj',x0,y0,x1,y1,el,dur,size,arc,t:0,onHit})}
function beam(x0,y0,x1,y1,el,dur,w){items.push({type:'beam',x0,y0,x1,y1,el,dur,w,t:0})}
function slash(x,y,c){for(let i=0;i<3;i++)items.push({type:'slash',x:x+rnd(-20,20),y:y+(i-1)*22,c,t:-i*.06,dur:.3,ang:rnd(-.5,-.2)})}
function drawShape(p,a){
  const s=p.size;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
  switch(p.shape){
    case 'star':ctx.fillStyle=p.color;ctx.beginPath();for(let i=0;i<8;i++){const r=i%2?s*.32:s,an=i*Math.PI/4;ctx.lineTo(Math.cos(an)*r,Math.sin(an)*r)}ctx.closePath();ctx.fill();ctx.restore();glow(p.x,p.y,s*1.4,p.color);return;
    case 'bubble':ctx.strokeStyle=p.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,s,0,6.28);ctx.stroke();ctx.fillStyle='rgba(200,240,255,.25)';ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-s*.35,-s*.35,s*.25,0,6.28);ctx.fill();break;
    case 'leaf':ctx.fillStyle=p.color;ctx.beginPath();ctx.ellipse(0,0,s,s*.45,0,0,6.28);ctx.fill();break;
    case 'shard':ctx.fillStyle=p.color;ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-s*1.2);ctx.lineTo(s*.4,0);ctx.lineTo(0,s*1.2);ctx.lineTo(-s*.4,0);ctx.closePath();ctx.fill();ctx.stroke();break;
    case 'flame':{ctx.restore();const c=a>.6?'#fff3a0':a>.3?'#ff9a2f':'#e0342a';glow(p.x,p.y,s*(.6+a)*1.6,c);return}
    case 'smoke':ctx.fillStyle=p.color;ctx.globalAlpha*=.45;ctx.beginPath();ctx.arc(0,0,s*(1+(1-a)*1.5),0,6.28);ctx.fill();break;
    case 'rock':ctx.fillStyle=p.color;ctx.strokeStyle='#5a4028';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-s,-s*.3);ctx.lineTo(-s*.2,-s);ctx.lineTo(s,-s*.4);ctx.lineTo(s*.7,s*.8);ctx.lineTo(-s*.6,s*.7);ctx.closePath();ctx.fill();ctx.stroke();break;
    default:ctx.restore();glow(p.x,p.y,s*2,p.color);return;
  }
  ctx.restore();
}
function fxStep(dt){
  ctx.clearRect(0,0,CW,CH);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}
    p.vx*=1-p.drag*dt;p.vy*=1-p.drag*dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    if(p.wander){p.vx+=rnd(-40,40)*dt;p.vy+=rnd(-40,40)*dt}
    const a=p.life/p.max;ctx.globalAlpha=Math.min(1,a*2)*(p.alpha||1);ctx.globalCompositeOperation=p.add?'lighter':'source-over';drawShape(p,a)}
  ctx.globalAlpha=1;
  for(let i=items.length-1;i>=0;i--){const it=items[i];it.t+=dt;const k=it.t/it.dur;if(it.t<0)continue;
    if(k>=1){items.splice(i,1);if(it.onHit)it.onHit(it.x1,it.y1);continue}
    ctx.globalCompositeOperation='lighter';const E=ELEM[it.el]||{c:it.c,c2:it.c};
    if(it.type==='proj'){const x=it.x0+(it.x1-it.x0)*k,y=it.y0+(it.y1-it.y0)*k-Math.sin(Math.PI*k)*it.arc;glow(x,y,it.size*3.2,E.c);glow(x,y,it.size*1.4,'#ffffff');
      spawn({x,y,vx:rnd(-30,30),vy:rnd(-30,30),life:.35,max:.35,size:it.size*.7,color:Math.random()<.5?E.c:E.c2,shape:E.shape==='smoke'?'dot':E.shape,drag:2});}
    else if(it.type==='beam'){const w=it.w*(k<.15?k/.15:k>.8?(1-k)/.2:1)*(1+Math.sin(it.t*40)*.12);ctx.lineCap='round';
      [[w*2.2,E.c,.3],[w,E.c,.85],[w*.4,'#fff',1]].forEach(([lw,c,al])=>{ctx.globalAlpha=al;ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(it.x0,it.y0);ctx.lineTo(it.x1,it.y1);ctx.stroke()});ctx.globalAlpha=1;
      const q=Math.random();spawn({x:it.x0+(it.x1-it.x0)*q,y:it.y0+(it.y1-it.y0)*q,vx:rnd(-80,80),vy:rnd(-80,80),life:.4,max:.4,size:rnd(4,8),color:E.c2,shape:E.shape==='smoke'?'dot':E.shape,drag:2});glow(it.x1,it.y1,w*2.5,E.c)}
    else if(it.type==='ring'){ctx.globalAlpha=1-k;ctx.strokeStyle=it.c;ctx.lineWidth=it.w*(1-k)+1;ctx.beginPath();ctx.arc(it.x,it.y,it.r1*k+6,0,6.28);ctx.stroke();ctx.globalAlpha=1}
    else if(it.type==='slash'){ctx.globalAlpha=1-k;ctx.strokeStyle='#fff';ctx.lineWidth=7*(1-k)+1;ctx.lineCap='round';ctx.beginPath();const L=70;ctx.moveTo(it.x-L*(1-k*.3),it.y-L*.5+it.ang*20);ctx.quadraticCurveTo(it.x,it.y-10,it.x+L*k,it.y+L*.4*k);ctx.stroke();ctx.globalAlpha=1}
  }
  ctx.globalCompositeOperation='source-over';
}

let B=null;
const hS=$('#hSprite'),eS=$('#eSprite'),arena=$('#arena');

function pt(sprite,fx,fy){const a=arena.getBoundingClientRect(),r=sprite.querySelector('.act').getBoundingClientRect();return{x:r.left-a.left+r.width*fx,y:r.top-a.top+r.height*fy}}

// --- Bewegungsanimationen eines Angriffs ---
function lunge(sprite,dx,dy,ms=220){sprite.querySelector('.act').animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx}%,${dy}%) scale(1.06,.94)`,offset:.4},{transform:'translate(0,0) scale(1)'}],{duration:ms,easing:'ease-out'})}
function playMove(M,fromHero,onHit){
  const S=fromHero?hS:eS,T=fromHero?eS:hS;
  const o=fromHero?heroMouth():enemyMouth(),t=fromHero?enemyCenter():heroCenter();
  const E=ELEM[M.el],dir=fromHero?1:-1;
  const done=(x,y)=>{onHit(x??t.x,y??t.y)};
  switch(M.fx){
    case 'orb':lunge(S,8*dir,-6*dir);proj(o.x,o.y,t.x,t.y,M.el,.28,9,40,done);break;
    case 'bigorb':lunge(S,10*dir,-8*dir,400);later(.15,()=>proj(o.x,o.y,t.x,t.y,M.el,.65,20,90,(x,y)=>{ring(x,y,E.c,130,.5,10);burst(x,y,M.el,30,260);done(x,y)}));break;
    case 'slash':lunge(S,30*dir,-26*dir,360);later(.16,()=>{slash(t.x,t.y,E.c);burst(t.x,t.y,M.el,8,140);done()});break;
    case 'beam':{for(let i=0;i<24;i++){const a=rnd(0,6.28),r=rnd(40,80);spawn({x:o.x+Math.cos(a)*r,y:o.y+Math.sin(a)*r,vx:-Math.cos(a)*r*2.2,vy:-Math.sin(a)*r*2.2,life:.45,max:.45,size:rnd(4,8),color:E.c,shape:'dot'})}
      sfx('charge');later(.5,()=>{beam(o.x,o.y,t.x,t.y,M.el,.75,26);shake(5,700);sfx('big')});later(.65,()=>{burst(t.x,t.y,M.el,26,240);done()});later(.95,()=>burst(t.x,t.y,M.el,14,180));break}
    case 'rain':{sfx('charge');for(let i=0;i<34;i++)later(i*.025,()=>{const x=t.x+rnd(-70,70);const sh=E.shape;spawn({x,y:-20,vx:rnd(-20,20),vy:rnd(700,900),life:(t.y+rnd(-30,40))/800,max:1,size:rnd(8,14),color:Math.random()<.5?E.c:E.c2,shape:sh==='smoke'?'dot':sh,drag:0,add:sh!=='rock'})});
      later(.75,()=>{burst(t.x,t.y,M.el,30,260);ring(t.x,t.y,E.c,130,.5,9);shake(8,400);sfx('big');done()});break}
    case 'nova':{lunge(S,6*dir,-4*dir,500);ring(o.x,o.y,E.c,90,.4,10);sfx('charge');later(.2,()=>proj(o.x,o.y,t.x,t.y,M.el,.35,16,10,(x,y)=>{for(let k=0;k<3;k++)later(k*.09,()=>ring(x,y,k%2?'#fff':E.c,150,.55,12));burst(x,y,M.el,36,320);shake(9,420);sfx('big');done(x,y)}));break}
    case 'vortex':{sfx('charge');const n=40;for(let i=0;i<n;i++)later(i*.018,()=>{const a0=i/n*Math.PI*6;items.push({type:'proj',x0:t.x+Math.cos(a0)*110,y0:t.y+Math.sin(a0)*60,x1:t.x,y1:t.y,el:M.el,dur:.5,size:6,arc:rnd(-30,30),t:0})});
      later(.95,()=>{ring(t.x,t.y,E.c,140,.55,12);burst(t.x,t.y,M.el,34,300);shake(8,420);sfx('big');done()});break}
    case 'storm':{lunge(S,8*dir,-6*dir,600);for(let k=0;k<5;k++)later(k*.09,()=>proj(o.x,o.y,t.x+rnd(-30,30),t.y+rnd(-30,30),M.el,.34,11,rnd(20,120),(x,y)=>{burst(x,y,M.el,8,160);sfx('hit');if(k===4){shake(7,380);done(t.x,t.y)}}));break}
    case 'quake':{S.querySelector('.act').animate([{transform:'translateY(0)'},{transform:'translateY(-18%)'},{transform:'translateY(0) scale(1.1,.88)'},{transform:'translateY(0)'}],{duration:500});
      later(.32,()=>{shake(14,600);sfx('big');for(let i=0;i<26;i++)spawn({x:t.x+rnd(-80,80),y:t.y+60,vx:rnd(-80,80),vy:rnd(-520,-260),g:900,life:1,max:1,size:rnd(6,12),color:E.c,shape:'rock',add:false});later(.25,()=>{burst(t.x,t.y,M.el,18,200);done()})});break}
  }
}

// --- Spielerin ---
function heroFast(){
  const h=B.hero;if(B.phase!=='fight'||h.cd>0||h.dodgeT>0)return;
  h.cd=.48;B.taps++;const M=MOVES[h.def.fast];sfx('tap');
  playMove(M,true,(x,y)=>{if(!B||!B.enemy||B.enemy.hp<=0)return;const r=calc(M,h,B.enemy);burst(x,y,M.el,8,140);hitFlash(eS);pop(x+rnd(-20,20),y-20,r.d,'dmg');damageEnemy(r.d);h.energy=Math.min(100,h.energy+M.e);updateHud()});
}
function heroDodge(dir){
  const h=B?B.hero:null;if(!h||!(B.phase==='fight'||B.phase==='anim'||B.phase==='etele')||h.dodgeCd>0)return;
  h.dodgeT=.55;h.dodgeCd=.75;h.lastDodge=B.clock;sfx('dodge');
  hS.querySelector('.act').animate([{transform:'translateX(0) rotate(0)'},{transform:`translateX(${dir*38}%) rotate(${dir*10}deg)`,offset:.35},{transform:`translateX(${dir*38}%) rotate(${dir*10}deg)`,offset:.65},{transform:'translateX(0) rotate(0)'}],{duration:550,easing:'ease-in-out'});
  const c=heroCenter();for(let i=0;i<8;i++)spawn({x:c.x+rnd(-30,30),y:c.y+rnd(-40,60),vx:-dir*rnd(80,160),vy:0,life:.35,max:.35,size:rnd(5,9),color:'#ffffff',shape:'dot',drag:3});
}
function heroCharged(k){
  const h=B?B.hero:null;if(!h||B.phase!=='fight')return;const M=MOVES[h.def.ch[k]];if(h.energy<M.c)return;
  h.energy-=M.c;updateHud();B.phase='charge';B.bonus=0;
  $('#dim').classList.add('on');hS.classList.add('glowing');$('#chargeHint').hidden=false;sfx('charge');
  banner(M.n,'',1000);
  const E=ELEM[M.el];
  for(let i=0;i<5;i++)later(.25+i*.33,()=>{const s=document.createElement('button');s.className='tapstar';s.setAttribute('aria-label','Stern');s.style.setProperty('--sc',E.c);
    s.style.left=rnd(18,82)+'%';s.style.top=rnd(22,62)+'%';arena.appendChild(s);
    const hitStar=ev=>{ev.stopPropagation();ev.preventDefault();if(s.dataset.hit)return;s.dataset.hit=1;B.bonus++;sfx('star');const a=arena.getBoundingClientRect(),r=s.getBoundingClientRect();const x=r.left-a.left+r.width/2,y=r.top-a.top+r.height/2;burst(x,y,'licht',12,180);pop(x,y-30,['','Gut!','Super!','Toll!','Exzellent!','Perfekt!'][B.bonus],'msg');s.remove()};
    s.addEventListener('pointerdown',hitStar);setTimeout(()=>s.remove(),950)});
  later(2.1,()=>{if(!B)return;$('#chargeHint').hidden=true;document.querySelectorAll('.tapstar').forEach(s=>s.remove());B.phase='anim';
    const mult=1+B.bonus*.12;
    playMove(M,true,(x,y)=>{if(!B||!B.enemy)return;const r=calc(M,h,B.enemy);const d=Math.round(r.d*mult);hitFlash(eS);pop(x,y-30,d,'dmg crit');effText(r.m,x,y);damageEnemy(d);updateHud();
      later(.5,()=>{$('#dim').classList.remove('on');hS.classList.remove('glowing');if(B&&B.phase==='anim')B.phase='fight'})});
  });
}
function damageEnemy(d){const e=B.enemy;e.hp-=d;updateHud();if(e.hp<=0&&B.phase!=='won'){e.hp=0;enemyDown()}}

// --- Gegner ---
function enemyFast(){
  const e=B.enemy,M=MOVES[e.def.fast];
  playMove(M,false,(x,y)=>{if(!B||B.phase==='won'||B.phase==='lost'||B.enemy!==e)return;const h=B.hero;
    if(B.clock-h.lastDodge<.6){pop(x,y-30,'Ausgewichen!','msg heal');return}
    const r=calc(M,e,h);hitFlash(hS);burst(x,y,M.el,8,140);pop(x,y-20,r.d,'dmg');sfx('hit');damageHero(r.d)});
  e.energy=Math.min(100,e.energy+M.e);
}
function enemyTelegraph(){const e=B.enemy;e.tele=1.15;e.teleStart=B.clock;B.phase='etele';eS.classList.add('tele');const w=document.createElement('div');w.className='warn';w.textContent='!';eS.appendChild(w);sfx('warn')}
function enemyCharged(){
  const e=B.enemy,M=MOVES[e.def.ch];eS.classList.remove('tele');const w=eS.querySelector('.warn');if(w)w.remove();
  e.energy-=M.c;B.phase='anim';const t=heroCenter();pop(enemyCenter().x,enemyCenter().y-90,M.n+'!','msg');
  playMove(M,false,(x,y)=>{if(!B||B.enemy!==e)return;const h=B.hero;const dodged=h.lastDodge>=e.teleStart-.05;
    const r=calc(M,e,h);let d=r.d;if(dodged){d=Math.max(1,Math.round(d*.2));B.dodges++;pop(x,y-60,'Ausgewichen!','msg heal')}else effText(r.m,x,y);
    hitFlash(hS);pop(x,y-20,d,dodged?'dmg':'dmg crit');damageHero(d);
    later(.45,()=>{if(B&&B.phase==='anim')B.phase='fight'})});
}
function damageHero(d){const h=B.hero;h.hp-=d;updateHud();if(h.hp<=0&&B.phase!=='lost'&&B.phase!=='won'){h.hp=0;updateHud();heroDown()}}

function enemyDown(){
  B.phase='won';const e=B.enemy;eS.classList.remove('tele');const w=eS.querySelector('.warn');if(w)w.remove();
  $('#dim').classList.remove('on');hS.classList.remove('glowing');document.querySelectorAll('.tapstar').forEach(s=>s.remove());$('#chargeHint').hidden=true;
  later(.3,()=>{const c=enemyCenter();sfx('poof');
    eS.querySelector('.act').animate([{transform:'scale(1)',filter:'brightness(1)',opacity:1},{transform:'scale(1.15,.9)',filter:'brightness(3)',opacity:1,offset:.3},{transform:'scale(.1) rotate(180deg)',filter:'brightness(4)',opacity:0}],{duration:700,easing:'ease-in',fill:'forwards'}).onfinish=a=>{const act=eS.querySelector('.act');act.getAnimations().forEach(x=>x.cancel());act.style.opacity='0'};
    later(.45,()=>{burst(c.x,c.y,'licht',40,320);ring(c.x,c.y,'#fff',160,.6,10);ring(c.x,c.y,ELEM[e.def.el].c,120,.5,8)});
    later(.6,()=>pop(c.x,c.y-40,'Besiegt!','msg'));
  });
  if(B.wave+1<B.st.en.length){later(2,()=>{if(B)spawnEnemy(B.wave+1)})}
  else later(1.6,victory);
}
function heroDown(){
  B.phase='lost';eS.classList.remove('tele');const w=eS.querySelector('.warn');if(w)w.remove();
  hS.querySelector('.act').animate([{transform:'rotate(0) translateY(0)',opacity:1},{transform:'rotate(-14deg) translateY(6%)',opacity:.4}],{duration:900,fill:'forwards'});
  sfx('lose');later(1.4,()=>endModal(false));
}
function victory(){
  const h=B.hero;sfx('win');
  hS.querySelector('.act').animate([{transform:'translateY(0) rotateY(0)'},{transform:'translateY(-22%) rotateY(180deg)'},{transform:'translateY(0) rotateY(360deg)'},{transform:'translateY(-8%)'},{transform:'translateY(0)'}],{duration:1100,easing:'ease-out'});
  const c=heroCenter();for(let k=0;k<4;k++)later(k*.2,()=>burst(c.x+rnd(-40,40),c.y-60+rnd(-30,30),'licht',16,220));
  later(1.2,()=>endModal(true));
}
function endModal(won){
  const P=B.hero.def,st=B.st,i=B.i,h=B.hero;let html='';
  if(won){
    const f=h.hp/h.maxHp,stars=f>.6?3:f>.3?2:1;const first=!(save.stars[i]>0);
    const before=PRINCESSES.filter(isUnlocked).map(p=>p.id);
    save.stars[i]=Math.max(save.stars[i]||0,stars);
    let xp=Math.round((25+st.lvl*18)*(first?1.5:1));const s=save.p[P.id];const oldL=s.lvl;s.xp+=xp;
    while(s.lvl<30&&s.xp>=xpNeed(s.lvl)){s.xp-=xpNeed(s.lvl);s.lvl++}
    if(s.lvl>=30)s.xp=0;persist();
    const newP=PRINCESSES.filter(p=>isUnlocked(p)&&!before.includes(p.id));
    let st3='';for(let k=0;k<3;k++)st3+=`<span style="animation-delay:${.15+k*.18}s;${k<stars?'':'color:rgba(255,255,255,.2)'}">★</span>`;
    html=`<h2>${i===STAGES.length-1?'Das Märchenreich ist gerettet!':'Sieg!'}</h2><div class="bigstars" style="color:var(--gold)">${st3}</div>
      <p>${P.n} erhält <b style="color:var(--ink)">${xp} EP</b>${first?' (Erstsieg-Bonus)':''}.</p>
      ${s.lvl>oldL?`<p style="color:var(--gold);font-weight:600">Stufe gestiegen! ${P.n} ist jetzt Lv ${s.lvl}.</p>`:''}
      ${newP.map(p=>`<div class="pic">${princessSVG(p)}</div><p style="color:var(--gold);font-weight:600">${p.n}, die ${p.t}, schließt sich dir an!</p>`).join('')}
      <div class="actions">${i+1<STAGES.length?'<button class="btn" id="mNext">Nächste Stufe</button>':''}<button class="btn soft" id="mMap">Zur Märchenreise</button></div>`;
  }else{
    html=`<h2>Oh nein!</h2><p>${P.n} braucht eine Pause. Sammle Erfahrung in früheren Stufen oder wähle eine Prinzessin mit passendem Element.</p><p>Tipp: Weiche aus, sobald über dem Gegner ein <b style="color:var(--gold)">!</b> erscheint.</p><div class="actions"><button class="btn" id="mRetry">Nochmal versuchen</button><button class="btn soft" id="mMap">Zur Märchenreise</button></div>`;
  }
  const idx=B.i;B.phase='done';
  $('#modalRoot').innerHTML=`<div class="modal"><div class="box">${html}</div></div>`;
  const close=()=>{$('#modalRoot').innerHTML='';B=null};
  const n=$('#mNext');if(n)n.onclick=()=>{close();sfx('click');startBattle(idx+1)};
  const r=$('#mRetry');if(r)r.onclick=()=>{close();sfx('click');startBattle(idx)};
  $('#mMap').onclick=()=>{close();sfx('click');show('map')};
}
function pauseMenu(){
  if(!B||B.phase==='done')return;B.paused=true;
  $('#modalRoot').innerHTML=`<div class="modal"><div class="box"><h2>Pause</h2><p>Durchatmen, Krone richten, weiter geht's.</p><div class="actions"><button class="btn" id="pRes">Weiterspielen</button><button class="btn soft" id="pQuit">Kampf verlassen</button></div></div></div>`;
  $('#pRes').onclick=()=>{$('#modalRoot').innerHTML='';if(B)B.paused=false;last=performance.now()};
  $('#pQuit').onclick=()=>{$('#modalRoot').innerHTML='';B=null;document.querySelectorAll('.tapstar').forEach(s=>s.remove());$('#dim').classList.remove('on');hS.classList.remove('glowing');$('#chargeHint').hidden=true;show('map')};
}
$('#pauseBtn').onclick=e=>{e.stopPropagation();sfx('click');pauseMenu()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&B&&!B.paused&&B.phase!=='done')pauseMenu()});
$('#dodgeL').onclick=e=>{e.stopPropagation();heroDodge(-1)};
$('#dodgeR').onclick=e=>{e.stopPropagation();heroDodge(1)};

// --- Eingabe: Tippen & Wischen ---
let ptr=null;
arena.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;ptr={x:e.clientX,y:e.clientY,t:performance.now()}});
arena.addEventListener('pointerup',e=>{if(!ptr||!B||B.paused)return;const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y,dt=performance.now()-ptr.t;ptr=null;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)&&dt<500)heroDodge(dx>0?1:-1);else heroFast()});
document.addEventListener('keydown',e=>{if(!B||$('#s-battle').hidden)return;
  if(e.code==='Space'){e.preventDefault();heroFast()}else if(e.code==='ArrowLeft')heroDodge(-1);else if(e.code==='ArrowRight')heroDodge(1);else if(e.key==='1')heroCharged(0);else if(e.key==='2')heroCharged(1);else if(e.key==='Escape')pauseMenu()});

/* ================= SPIELSCHLEIFE ================= */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(B&&!B.paused){
    B.clock+=dt;
    for(let i=B.timers.length-1;i>=0;i--){const t=B.timers[i];t.t-=dt;if(t.t<=0){B.timers.splice(i,1);try{t.fn()}catch(err){console.error(err)}}}
    if(!B)return requestAnimationFrame(loop);
    const h=B.hero,e=B.enemy;h.cd-=dt;h.dodgeT-=dt;h.dodgeCd-=dt;
    if(B.phase==='fight'&&e&&e.hp>0){
      e.energy=Math.min(100,e.energy+dt*2.5);
      e.fastT-=dt;if(e.fastT<=0){e.fastT=e.interval*rnd(.85,1.15);if(e.energy>=MOVES[e.def.ch].c&&Math.random()<.65)enemyTelegraph();else enemyFast()}
    }else if(B.phase==='etele'){e.tele-=dt;if(e.tele<=0)enemyCharged()}
    // Umgebungspartikel
    B.amb-=dt;if(B.amb<=0){B.amb=.12;const k=CHAPTERS[B.st.ch].bg;
      if(k==='wald')spawn({x:rnd(0,CW),y:rnd(CH*.3,CH),vx:rnd(-10,10),vy:rnd(-15,5),life:3,max:3,size:rnd(2,4),color:'#d6ff7a',shape:'dot',wander:true,alpha:.8});
      else if(k==='eis')spawn({x:rnd(-20,CW),y:-10,vx:rnd(10,40),vy:rnd(40,90),life:CH/60,max:CH/60,size:rnd(2,4),color:'#ffffff',shape:'dot',alpha:.9});
      else spawn({x:rnd(0,CW),y:CH+10,vx:rnd(-15,15),vy:rnd(-70,-30),life:CH/60,max:CH/60,size:rnd(2,4),color:'#ff9a3a',shape:'dot',wander:true})}
    fxStep(dt);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
show('home');
</script>
